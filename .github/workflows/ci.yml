name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# No job in this workflow writes to the repository — nothing comments, pushes or releases — so
# the whole file runs read-only. Without this block GitHub applies the repository default, which
# zizmor flags as excessive-permissions: a compromised action step would inherit whatever that
# default happens to be. Jobs that need less still narrow it further themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations-check:
    name: Migrations Check
    runs-on: ubuntu-latest
    # Runs on every push and PR (no secrets needed) so a duplicate migration
    # version is caught before merge — never silently at deploy time. Two files
    # sharing a <version>_ prefix make `supabase db push` abort on the second
    # one's schema_migrations insert (duplicate pkey), skipping every migration
    # queued behind it.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ensure migration versions are unique
        run: |
          dups="$(ls -1 supabase/migrations/*.sql 2>/dev/null \
            | xargs -n1 basename \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort | uniq -d)"
          if [ -n "$dups" ]; then
            echo "::error::Duplicate migration version(s): $dups"
            echo "Every file in supabase/migrations must have a unique <version>_ prefix."
            for v in $dups; do echo "  clashing files for $v:"; ls -1 supabase/migrations/${v}_*.sql; done
            exit 1
          fi
          echo "All migration versions are unique."
      - name: Security regression gate (no anon-writable policies in new migrations)
        # Static, deterministic, no DB or secrets needed — so it runs on every PR, unlike
        # the RLS Boundaries job which needs live credentials. From PR #735 (billmal071).
        run: node scripts/check-migration-security.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  mobile-typecheck:
    name: Type Check (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The Expo app has its OWN package.json + package-lock.json and is not part of the
      # pnpm workspace install, so this job installs it with npm rather than reusing the
      # web job's node_modules. It reaches back into packages/shared via a file: dep.
      #
      # Added because apps/mobile had drifted to 13 type errors while nothing checked it:
      # `lib/game-rules.ts` was missing Wordle and Troll Run (a broken in-lobby Rules link
      # for two shipped games), `formatDayLabel` was imported but never defined, and the
      # Whot / Crazy Eights session types had lost the `updated_at` their realtime
      # delta fast-path orders on. All invisible without this gate.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --prefix apps/mobile
      - run: npm --prefix apps/mobile run typecheck

  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    needs: [lint, format, typecheck]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-for-build-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  migrate:
    name: DB Migrate
    needs: [build, migrations-check]
    # Only on a push to dev or main — never an unmerged PR, and never another
    # branch (gating here, before `environment` attaches, keeps the Preview/
    # Production secrets off unrelated branch pushes).
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    # Select the matching GitHub Environment so secrets.SUPABASE_* resolve to the
    # right project's credentials: main -> Production, dev -> Preview.
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
    # Read-only repo access — this job only reads migrations and pushes to the DB.
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Opt-in acknowledgement that a compatible mobile build has shipped. A repository VARIABLE,
      # deliberately not a secret: it is an operational flag, not a credential, and it should be
      # visible to anyone auditing why a revoke was allowed through.
      MOBILE_ROLLOUT_ACK: ${{ vars.MOBILE_ROLLOUT_ACK }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 branch head
        with:
          version: 2.108.0
      # Apply migrations to the environment's own Supabase project, using that
      # GitHub Environment's secrets (DB password differs per project).
      #   main -> Production project (skhvbzitwvnbhqxfitgh)
      #   dev  -> Preview project    (xzvsrzbbgxbaagqwtpts)
      # --include-all applies every migration missing from the remote history
      # table, regardless of version order (migrations land from separate PRs and
      # can arrive older-than-latest). Already-applied versions are skipped, so
      # re-runs are no-ops.
      - name: Apply migrations
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Supabase secrets not configured for this environment — skipping DB migrate."
            exit 0
          fi
          case "${GITHUB_REF_NAME}" in
            main) REF="skhvbzitwvnbhqxfitgh" ;;  # production
            dev)  REF="xzvsrzbbgxbaagqwtpts" ;;  # preview
            *)
              echo "No Supabase project wired for '${GITHUB_REF_NAME}' — skipping."
              exit 0
              ;;
          esac
          supabase link --project-ref "$REF"

          # Fail loudly on any push error. We deliberately do NOT swallow the
          # "duplicate schema_migrations_pkey" failure: the only thing that
          # produced it was two files sharing a version, which db push applies in
          # order until the second one's history insert collides — silently
          # skipping every migration behind it. Unique versions are enforced by
          # the migrations-check job, so a non-zero exit here is a genuine problem
          # a human must look at, not something to paper over.
          # ── Revoke guard (runs for BOTH environments) ─────────────────────────
          # This job applies migrations on a push to main (Production project) or to dev (Preview
          # project) and needs only [build, migrations-check]. The Mobile Rollout Gate is a
          # SEPARATE workflow on pull_request -> main, so it constrains this only if branch
          # protection requires it — and `main` has no protection at all. Without this guard a
          # column revoke reaches the target project while installed builds still select that
          # column, PostgREST fails the WHOLE request with 42501, and OTA cannot rescue an
          # installed binary. That is just as true of Preview: the dev mobile build is a
          # different artifact at a different rollout state, and Preview serves installed
          # internal/test builds that break in exactly the same way. So the guard runs on every
          # ref this job runs for (the job-level `if:` already limits that to dev and main).
          #
          # MOBILE_ROLLOUT_ACK is read as `vars.MOBILE_ROLLOUT_ACK`, and GitHub resolves `vars`
          # environment-first, so setting it on the GitHub ENVIRONMENT (Production for main,
          # Preview for dev) makes the acknowledgement per-environment with no workflow change.
          # That separation is the point: acknowledging a revoke for Production must not silently
          # authorise the same revoke against Preview, or vice versa. Environment-first is a
          # precedence, not an isolation: a REPOSITORY-level MOBILE_ROLLOUT_ACK would fall through
          # to any environment that has not defined its own, and would then authorise both. There
          # is deliberately no repository-level value (checked 2026-09-13, both environments and
          # the repo have none) — set this variable ONLY on an environment, never repo-wide.
          #
          # The acknowledgement names the VERSIONS it authorises — it is not a boolean. A blanket
          # "1" would persist as a variable long after the release it was set for, and the NEXT
          # revoke would then reach that project with no rollout behind it. Requiring the exact
          # version means a stale value authorises only the migration it was set for, and
          # forgetting to clear it is inert rather than dangerous.
          #
          #   MOBILE_ROLLOUT_ACK="20261121120000"                     one migration
          #   MOBILE_ROLLOUT_ACK="20261121120000 20261120120000"      several
          #
          # Two details that matter:
          #  1. The table is parsed on "|", not whitespace. `supabase migration list` prints
          #     "Local | Remote | Time (UTC)", so whitespace tokenisation makes $3 the SEPARATOR,
          #     never an empty remote field — that version of this guard matched nothing and
          #     failed OPEN.
          #  2. It FAILS CLOSED: if no local versions parse, the format has changed and we cannot
          #     tell what is pending, so it blocks.
          #
          # The revoke test reads CONTENT, not the filename: 20261003120000 is still called
          # `sec_uno_hide_piles` but is now the ADDITIVE half of a split and is safe to apply.
          case "${GITHUB_REF_NAME:-}" in
            main) GUARD_ENV="Production" ;;
            *)    GUARD_ENV="Preview" ;;
          esac
          GUARD_TARGET="$GUARD_ENV (ref ${GITHUB_REF_NAME:-unknown}, Supabase project $REF)"
          listing=$(supabase migration list --linked 2>/dev/null || true)
          local_total=$(printf '%s\n' "$listing" | awk -F'|' '{ l=$1; gsub(/[^0-9]/,"",l); if (length(l)==14) print l }' | wc -l | tr -d ' ')
          if [ "$local_total" = "0" ]; then
            echo "::error::Could not parse 'supabase migration list' output, so pending revokes cannot be identified."
            echo "Failing closed rather than pushing to $GUARD_TARGET blind. Check the CLI output format."
            exit 1
          fi
          pending=$(printf '%s\n' "$listing" | awk -F'|' '{ l=$1; r=$2; gsub(/[^0-9]/,"",l); gsub(/[^0-9]/,"",r); if (length(l)==14 && length(r)==0) print l }')
          unacked=""
          for version in $pending; do
            for file in supabase/migrations/"$version"_*.sql; do
              [ -f "$file" ] || continue
              sed 's/--.*//' "$file" | grep -qiE '\brevoke\b' || continue
              # acknowledged only if this exact version is listed
              case " ${MOBILE_ROLLOUT_ACK:-} " in
                *" $version "*) echo "Revoke guard: $file acknowledged by MOBILE_ROLLOUT_ACK for $GUARD_ENV." ;;
                *) unacked="$unacked  $file (version $version)\n" ;;
              esac
            done
          done
          if [ -n "$unacked" ]; then
            echo "::error::Refusing to apply unacknowledged REVOKE migrations to $GUARD_TARGET:"
            printf "%b" "$unacked"
            echo "These revoke columns installed builds still request; PostgREST fails the whole query"
            echo "with 42501 and OTA cannot rescue an installed build."
            echo "Ship a compatible mobile build for this target, let old installs drain, then set"
            echo "MOBILE_ROLLOUT_ACK to the exact version(s) above, space-separated, on the GitHub"
            echo "ENVIRONMENT being deployed — here that is the '$GUARD_ENV' environment"
            echo "(Settings -> Environments -> $GUARD_ENV -> Environment variables), NOT the"
            echo "repository-wide variable: a Production acknowledgement must not authorise"
            echo "Preview, nor a Preview one Production."
            exit 1
          fi
          echo "Revoke guard: $local_total migrations known, no unacknowledged pending revokes for $GUARD_TARGET."

          supabase db push --include-all

  rls-boundaries:
    name: RLS Boundaries
    needs: [migrate]
    # Runs straight after migrations land, against that environment's own Supabase project, and
    # asserts the rule docs/rls-hardening.md is built on: the publishable anon key can read game
    # state and write nothing. This is the gate that would have caught the Aug 2026 audit's C1,
    # C2, H1 and H2 at the commit that introduced each — see
    # src/lib/rls-boundaries.integration.test.ts.
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Fail loudly rather than skipping. A security gate that silently no-ops when a secret is
      # missing reports green while the boundary is open — which is the exact failure mode this
      # job exists to catch.
      - name: Require credentials
        run: |
          missing=""
          [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && missing="$missing NEXT_PUBLIC_SUPABASE_URL(var)"
          [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ] && missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY(var)"
          [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing on the ${{ github.ref_name == 'main' && 'Production' || 'Preview' }} environment:$missing"
            echo "Add them so the RLS boundary check can run. Refusing to pass without checking."
            exit 1
          fi

          # Guard against the two DB jobs pointing at DIFFERENT projects. `DB Migrate` PINS the ref
          # (--project-ref below), but this job FOLLOWS the environment's NEXT_PUBLIC_SUPABASE_URL.
          # If they diverge — e.g. a Production env whose URL/keys were left pointing at Preview —
          # migrate migrates one project while this tests another, and the test reports the opaque
          # "expected 0 to be greater than 50". Assert the URL names the same project migrate targets.
          # Keep these two refs in sync with the `case` in the DB Migrate job above.
          case "${GITHUB_REF_NAME}" in
            main) expected_ref="skhvbzitwvnbhqxfitgh" ;;  # production
            dev)  expected_ref="xzvsrzbbgxbaagqwtpts" ;;  # preview
            *)    expected_ref="" ;;
          esac
          if [ -n "$expected_ref" ] && ! printf '%s' "${NEXT_PUBLIC_SUPABASE_URL}" | grep -q "$expected_ref"; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL on the ${{ github.ref_name == 'main' && 'Production' || 'Preview' }} environment does not name the project DB Migrate targets ($expected_ref). The two jobs would act on different projects — fix this environment's NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / NEXT_PUBLIC_SUPABASE_ANON_KEY so all point at $expected_ref."
            exit 1
          fi
      - run: pnpm vitest run src/lib/rls-boundaries.integration.test.ts

  rls-boundaries-local:
    name: RLS Boundaries (local)
    # The same security gate as `RLS Boundaries` above, run against a throwaway Supabase stack
    # started inside the runner instead of a hosted project. Three reasons this job exists:
    #
    #   1. The hosted job needs `needs: [migrate]`, an environment, and three secrets, so it only
    #      runs on PUSH to dev/main — i.e. after merge. This one runs on PULL REQUESTS, which is
    #      where a boundary regression is still cheap to fix, and it is the only form of this
    #      check that can be made a REQUIRED status check (see issue #1131).
    #   2. It costs nothing and depends on no quota. The hosted dev project has been 402'd since
    #      2026-08-24, so `RLS Boundaries` has been failing rather than checking since then.
    #   3. It tests the migrations in THIS PR, not whatever state a shared project drifted into.
    #
    # It does NOT replace the hosted job: only that one can catch a hosted project whose grants
    # diverge from the migrations (a hand-run GRANT in the dashboard). Keep both.
    runs-on: ubuntu-latest
    # `supabase start` pulls and boots several containers; a hung pull or a wedged container would
    # otherwise hold a runner for GitHub's 6-hour default. A healthy run is ~4 minutes.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The Supabase CLI's local-development demo keys. Constant across every local stack and
      # published in Supabase's own docs -- not secrets, and deliberately not stored as any.
      LOCAL_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      LOCAL_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The deploy-equivalent cron gate has to know which migrations this
          # branch ADDS, which means reaching the base revision. A shallow clone
          # cannot, and the gate hard-fails rather than guessing -- so the whole
          # history is fetched here. Nothing else in this job needs it.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 branch head
        with:
          version: 2.108.0

      # Applies every migration in supabase/migrations from scratch, in order.
      - name: Start local Supabase
        run: supabase start

      # ── The deploy-equivalent cron.job gate (issues #1166/#1167/#1175) ───────
      #
      # cron.job immediately after `supabase start` is what applying this PR's
      # migration set produces -- the state a deploy produces, PROVIDED nothing
      # but migrations shaped it. That proviso is checked below and is not free:
      # `supabase start` runs supabase/roles.sql and then supabase/seed.sql
      # AFTER the migrations (MigrateAndSeed -> applyMigrationFiles,
      # applySeedFiles), seeding is on by default with sql_paths ["seed.sql"],
      # and both files are PR-authored. A post-guard migration that schedules a
      # rogue job plus a seed.sql that unschedules it again leaves this step
      # looking at a clean database while production, which never runs seed.sql,
      # keeps the job. Neither file exists in this repo today, so the gate
      # requires that to stay true rather than trying to model them.
      #
      # The state exists only here: `Idle-reaper cron guard branches are exercised`
      # unschedules and reschedules reap_idle_active_games as part of its
      # fixtures, and the HTTP cron gate re-runs the scheduling guard, so by the
      # end of this job the deploy-equivalent state is gone.
      #
      # It is therefore asserted HERE, against the live database, and not
      # recorded for a later step to judge. An earlier version wrote the rows to
      # a CSV in RUNNER_TEMP with a SHA-256 in a sidecar file and checked them
      # after the RLS suite. That was not worth the bytes it was written in: the
      # vitest suite runs in between, the pull request owns that suite and its
      # config, and GITHUB_RUN_ID / GITHUB_RUN_ATTEMPT / GITHUB_SHA are all in
      # its process.env -- so about fifteen lines of `forge.js` wrote a clean CSV
      # and a matching status file, and the gate reported success while the
      # database held a reaper posting to an attacker host. A table instead of a
      # file buys nothing either: that suite can shell out to psql with the same
      # fixed local DSN this step uses. Nothing carried across a step the pull
      # request controls is evidence.
      #
      # What it cannot forge is the RUNNER's own record of whether this step
      # passed. So this step asserts immediately, and `continue-on-error` lets
      # the job keep going to the RLS boundary suite -- which is this job's main
      # purpose and must not be masked by a cron finding. `The deploy-equivalent
      # cron gate must have passed`, after the suite, turns a failure here into a
      # failed job by reading `steps.deploy_cron_state.outcome`. That value is
      # set by the runner when this step ends; no later step can change it.
      #
      # The other assertion point is the HTTP cron gate at the end of this job,
      # which re-runs the scheduling guard with the GUCs set. The two are not
      # interchangeable (#1175): the guard unconditionally unschedules and
      # reschedules all three of its jobs from literals in its own file, so
      # assertions made after it observe what it just wrote. On production
      # 20261124 is already applied and will not re-run, so a LATER migration
      # wins there; in this job it is force-re-run, so it always wins here.
      #   * THIS step red => a migration in this PR changed what a DEPLOY
      #     schedules. Production would get the state printed below.
      #   * the HTTP gate red => the guard migration's own scheduling path is
      #     broken. An already-migrated database would be unaffected.
      - name: cron.job matches the deploy-equivalent inventory
        id: deploy_cron_state
        # Report, do not abort: see above. The verdict is enforced after the RLS
        # suite, from this step's runner-recorded outcome.
        continue-on-error: true
        env:
          # `run:` steps execute as `bash -e {0}`, and bash SOURCES $BASH_ENV
          # before the script body. Every step can write to $GITHUB_ENV, whose
          # runner-side blocklist is a single entry (NODE_OPTIONS), so any
          # earlier step -- including the root `prepare` hook that
          # `pnpm install --frozen-lockfile` runs several steps above -- can set
          # BASH_ENV to a file that defines a shell function named `psql`, or
          # re-exports any variable this step reads. A step-level `env:` entry
          # takes precedence over a $GITHUB_ENV one, so pinning it empty means
          # bash sources nothing. Every step in this gate carries it.
          BASH_ENV: ''
        run: |
          set -euo pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          GUARD_MIGRATION_FILE=20261124120000_noisy_http_cron_scheduling_guard.sql

          # ── Did anything but migrations shape this database? ─────────────────
          #
          # `supabase start` applies supabase/roles.sql and supabase/seed.sql
          # after the migrations, and both are PR-authored, so "this is what the
          # migrations produced" is only true while neither exists. A seed that
          # unschedules a job a migration registered leaves cron.job clean here
          # and leaves the job in place on production, which never runs it.
          #
          # This is a statement about the TREE, not about the diff: it holds
          # however the file arrived. The two names are exactly what
          # `supabase start` executes by default -- supabase/tests/*.sql is NOT
          # in that set (those are pgTAP files for `supabase test db`, which this
          # job never runs), so they are deliberately not listed. A [db.seed]
          # sql_paths entry could point somewhere else entirely, including
          # outside supabase/, which is why the config is checked too.
          stray_sql=""
          for f in supabase/roles.sql supabase/seed.sql; do
            [ -f "$f" ] && stray_sql="$stray_sql $f"
          done
          if [ -n "$stray_sql" ]; then
            echo "::error::SQL that \`supabase start\` executes after the migrations is present in this branch:$stray_sql"
            echo "supabase/roles.sql and supabase/seed.sql are applied by \`supabase start\` AFTER every migration, and seeding is on by default. Production never runs them, so anything they do to cron.job makes the state this gate inspects differ from the state a deploy produces -- a seed that unschedules a job a migration registered is enough to turn this gate green while production keeps the job."
            echo "TO FIX: if the repo is genuinely adopting seeding, this gate has to be taught to account for it (assert before the seed runs, or prove the seed cannot touch cron.job) -- it cannot simply be allowed through."
            exit 1
          fi
          if grep -q 'sql_paths' supabase/config.toml; then
            echo "::error::supabase/config.toml configures sql_paths, which redirects what \`supabase start\` executes after the migrations."
            echo "Same reason as above: production applies migrations only, so any other SQL running here makes this gate inspect a state a deploy would not produce."
            exit 1
          fi

          # ── Is this state deploy-equivalent at all? ──────────────────────────
          #
          # Only if CI and production apply this PR's migrations in the same
          # relative order, and nothing makes them. `supabase start` applies
          # every file from scratch in filename order; the deploy runs
          # `supabase db push --include-all`, which applies whatever the remote
          # history table is missing on top of what is already recorded; and
          # `migrations-check` enforces version UNIQUENESS, not monotonicity. So
          # a back-dated file sorts BEFORE the scheduling guard here -- the guard
          # re-runs afterwards and overwrites whatever it did, leaving a clean
          # state -- and applies AFTER the already-recorded guard on production,
          # where it wins.
          #
          # This does not look at file CONTENTS. It was first written as
          # `grep -q 'cron\.'`, which missed `SELECT CRON.schedule(...)`,
          # `select "cron"."schedule"(...)`, a newline before the dot,
          # `set search_path = cron` and string concatenation, while matching
          # migrations whose only mention of cron was an English comment. A
          # lexical test of SQL is always one quoting trick behind. The invariant
          # that makes the two orders agree is purely about filenames: every
          # migration this branch ADDS must sort after every migration the base
          # branch already has.
          #
          # --no-renames is load-bearing. `diff.renames` has defaulted to true
          # since git 2.9, so introducing a back-dated migration with `git mv`
          # from another file in supabase/migrations/ reports as R, not A, and
          # selects nothing at all -- neither the prefix check nor the ordering
          # check nor the re-apply list. (A rename whose SOURCE is outside the
          # pathspec already reports as A, because the pathspec breaks the pair.)
          #
          # Comparison is by FILENAME under the C collation, not by parsing the
          # version as a number: `202611241200001_x.sql` is numerically greater
          # than 20261124120000 but sorts BEFORE the guard's filename ('1' 0x31 <
          # '_' 0x5F at position 15). Added files must carry exactly the 14-digit
          # prefix CONTRIBUTING.md specifies, which removes that class.
          #
          # This step does NOT check that versions are unique -- two added files
          # sharing a <version>_ prefix both sort fine on full filename. That is
          # the `migrations-check` job's invariant, and this one leans on it.
          #
          # HONEST SCOPE: this workflow is part of the pull request it judges, so
          # anyone willing to edit it in the same commit is not stopped -- not by
          # this rule, not by the declared-jobname lists below, and not by the
          # verdict step. What it stops is the accident, and it makes the
          # deliberate version a visible edit, in the diff, to the file that
          # does the checking -- something a reviewer reading the pull request
          # will see. (Not an enforced boundary: this repo has no CODEOWNERS
          # today. Visibility is the entire claim.)
          #
          # The base is HEAD's FIRST PARENT, not github.event.pull_request.base.sha.
          # On a pull_request event the checkout is refs/pull/N/merge, whose
          # first parent is the base branch as it stands NOW; base.sha is frozen
          # at event time, so re-running an older run compared new-dev against
          # old-dev and attributed another PR's migrations to this branch. On a
          # push, HEAD^1 is the previous tip of the branch being pushed, which is
          # the same question. Which files this branch ADDED is then measured
          # from the merge base rather than from the base tip, so a migration the
          # base gained while this PR was open is not attributed to this PR --
          # while base_last still comes from the base TIP, because that is what
          # production has already applied and what an added file must sort after.
          base_sha=$(git rev-parse --verify --quiet 'HEAD^1' || true)
          if [ -z "$base_sha" ]; then
            echo "::error::HEAD has no first parent, so there is no base revision to compare migrations against. Usually this means the checkout is shallow -- this job needs \`fetch-depth: 0\` -- or HEAD is a root commit. Either way the gate cannot tell which migrations this branch adds and will not guess."
            exit 1
          fi
          head_sha=$(git rev-parse --verify 'HEAD^2' 2>/dev/null || git rev-parse --verify HEAD)
          fork_point=$(git merge-base "$base_sha" "$head_sha")

          base_last=$(git ls-tree --name-only "$base_sha" supabase/migrations/ \
            | sed 's#.*/##' | LC_ALL=C sort | tail -n1)
          if [ -z "$base_last" ]; then
            echo "::error::The base revision $base_sha has no files under supabase/migrations/. Refusing to reason about migration ordering from an empty base."
            exit 1
          fi

          # --no-renames: `diff.renames` defaults to true, and a rename inside
          # supabase/migrations/ reports as R, which --diff-filter=A would not
          # select at all -- see the comment above.
          added=$(git diff --no-renames --name-only --diff-filter=A "$fork_point" "$head_sha" -- supabase/migrations/ | sed 's#.*/##' | LC_ALL=C sort)

          # Where this branch is headed decides how strict the ordering rule is
          # below. GITHUB_BASE_REF is the PR's target branch and is empty on a
          # push, where GITHUB_REF_NAME is the branch being pushed.
          target_branch="${GITHUB_BASE_REF:-${GITHUB_REF_NAME:-}}"

          reapply_list=""
          before_guard=""
          behind_base=""
          bad_prefix=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*.sql) : ;;
              *) bad_prefix="$bad_prefix $f"; continue ;;
            esac
            # Two different situations, and conflating them was wrong. Sorting
            # at or before the SCHEDULING GUARD is the bypass this gate exists
            # for: the guard re-runs during `supabase start` and overwrites
            # whatever an earlier file did, so CI sees a clean cron.job while
            # production -- where the guard is already recorded and will not
            # re-run -- applies the earlier file last and keeps its version.
            # That is always an error.
            if [ "$f" = "$GUARD_MIGRATION_FILE" ] || [ "$(printf '%s\n%s\n' "$f" "$GUARD_MIGRATION_FILE" | LC_ALL=C sort | head -n1)" != "$GUARD_MIGRATION_FILE" ]; then
              before_guard="$before_guard $f"
              continue
            fi
            # Sorting after the guard but before the base branch's newest
            # migration is a different thing: another migration landed on the
            # base while this branch was open. On a PR into dev that is routine
            # and does not affect production -- prod migrates on push to main,
            # where both files are still pending and will apply in version order
            # together -- so it is a warning. It is still worth saying, because
            # the dev project HAS already applied the other file and will take
            # this one after it. On a promotion into main it is the reverse and
            # genuinely blocking: main holding a migration dev does not means an
            # unsynced hotfix, and the promotion really would apply dev's
            # backlog out of order against the production project.
            if [ "$f" = "$base_last" ] || [ "$(printf '%s\n%s\n' "$f" "$base_last" | LC_ALL=C sort | head -n1)" != "$base_last" ]; then
              behind_base="$behind_base $f"
            fi
            if [ "$(printf '%s\n%s\n' "$f" "$GUARD_MIGRATION_FILE" | LC_ALL=C sort | head -n1)" = "$GUARD_MIGRATION_FILE" ] && [ "$f" != "$GUARD_MIGRATION_FILE" ]; then
              reapply_list="$reapply_list$(printf 'supabase/migrations/%s\n' "$f")"$'\n'
            fi
          done <<< "$added"

          # Handed to the HTTP cron gate as a STEP OUTPUT rather than a file, for
          # the same reason the inventory is asserted here: the runner holds it
          # and no later step can rewrite it. Emitted before any assertion below
          # can fail, so the gate sees it even on a red verdict.
          {
            echo "reapply<<CRON_REAPPLY_EOF"
            printf '%s' "$reapply_list"
            echo "CRON_REAPPLY_EOF"
            echo "computed=yes"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$bad_prefix" ]; then
            echo "::error::Migration(s) added by this branch do not carry the 14-digit UTC timestamp prefix CONTRIBUTING.md specifies:$bad_prefix"
            echo "Apply order is decided by filename, so a prefix of any other length cannot be reasoned about -- a 15-digit one sorts before a 14-digit one with a larger value. Rename with \`supabase migration new <name>\`."
            exit 1
          fi
          if [ -n "$before_guard" ]; then
            echo "::error::Migration(s) added by this branch sort at or before the cron scheduling guard ($GUARD_MIGRATION_FILE):$before_guard"
            echo "The guard is already applied on both hosted projects and will not run again there, but \`supabase start\` re-runs it here -- and it unconditionally reschedules all three of its jobs. So a migration that sorts before it is overwritten in CI and wins on production, and this gate would be judging a state no deploy produces. Give the migration a filename that sorts after $GUARD_MIGRATION_FILE."
            exit 1
          fi
          if [ -n "$behind_base" ]; then
            if [ "$target_branch" = "main" ]; then
              echo "::error::This is a promotion into main, and migration(s) it brings sort before main's newest migration ($base_last):$behind_base"
              echo "main holding a migration dev does not means a hotfix landed there without the sync-back CONTRIBUTING.md requires. Until that sync happens the promotion really would apply these out of order against the production project, which has already applied $base_last. Merge main back into dev first."
              exit 1
            fi
            echo "::warning::Migration(s) added by this branch sort before the newest migration already on $target_branch ($base_last):$behind_base -- another migration landed while this branch was open."
            echo "Not blocking, and nothing to do about it: production migrates on push to main, where these are all still pending and will apply together in version order. The $target_branch project has already applied $base_last and will take these after it, so if both touch the same object, check that order is harmless there."
          fi
          echo "No migration this branch adds sorts at or before $GUARD_MIGRATION_FILE, so CI and the deploy agree about what the scheduling guard leaves behind."
          if [ -n "$reapply_list" ]; then
            echo "Added after the scheduling guard, to be re-applied with the GUCs set by the HTTP cron gate:"
            printf '%s' "$reapply_list" | sed 's/^/  /'
          else
            echo "This branch adds no migration after the scheduling guard."
          fi

          # ── The state itself ────────────────────────────────────────────────
          if ! psql "$DB" -v ON_ERROR_STOP=1 -q -c "select 1;" >/dev/null; then
            echo "::error::Cannot reach the local Postgres at 127.0.0.1:54322. Refusing to judge the deploy-equivalent cron state on a half-started stack."
            exit 1
          fi

          # Deliberately NOT `create extension if not exists pg_cron`. The point
          # is to look at the state the MIGRATIONS left; installing the extension
          # now would manufacture an empty cron.job and turn "nothing was
          # scheduled" into a confusing per-job "absent" list.
          #
          # pg_net availability changes what the migrations schedule:
          # 20261123120000 and 20261124120000 both return before registering
          # reap_idle_active_games when pg_net is missing, so on such an image
          # the reaper is legitimately absent. 20261005120000 schedules its two
          # pure-SQL jobs BEFORE its own pg_net check, so those are present
          # either way.
          cron_present=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc "select to_regclass('cron.job') is not null;")
          pg_net_available=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc "select exists (select 1 from pg_available_extensions where name = 'pg_net');")
          if [ "$cron_present" != "t" ]; then
            if ! unavailable=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc \
                "select coalesce(string_agg(e, ', '), '') from unnest(array['pg_cron','pg_net']) e where not exists (select 1 from pg_available_extensions a where a.name = e);"); then
              echo "::error::cron.job does not exist and the follow-up availability probe could not connect either. Refusing to skip on an unhealthy stack."
              exit 1
            fi
            if [ -z "$unavailable" ]; then
              echo "::error::cron.job does not exist even though pg_cron is listed in pg_available_extensions. The migrations should have created the extension and scheduled the jobs -- that is a real failure, not an environment difference."
              exit 1
            fi
            echo "::warning::Not available in this local stack: $unavailable -- deploy-equivalent cron inventory skipped."
            exit 0
          fi

          echo "cron.job as \`supabase start\` left it (pg_net available: $pg_net_available):"
          psql "$DB" -v ON_ERROR_STOP=1 -c "select jobname, schedule, active, database, username, nodename, nodeport, command from cron.job order by jobname, jobid;"

          if [ "$pg_net_available" = "t" ]; then
            reaper_must_exist=true
            reaper_absent_reason=null
          else
            reaper_must_exist=false
            reaper_absent_reason="'pg_net is unavailable in this stack, so both cron migrations return before scheduling it'"
            echo "::warning::pg_net is unavailable in this stack, so reap_idle_active_games is expected to be absent."
          fi

          # A FULL INVENTORY, not a whitelist-of-three presence check (#1175).
          # Every row is accounted for: each declared job is checked for
          # presence/absence, schedule, command, and the five columns that decide
          # whether it runs at all and against what -- `active`, `database`,
          # `username`, `nodename`, `nodeport`. Any row whose jobname is not
          # declared is reported as rogue. Without the inventory half, an extra
          # job posting to an attacker host is invisible here.
          #
          # Commands are compared in full with runs of whitespace collapsed --
          # and the whitespace class is spelled out as ASCII rather than written
          # `\s`. In this image's en_US.UTF-8 locale Postgres's `\s` also matches
          # U+2000, U+2003, U+2028, U+2029 and U+3000, which the SQL lexer does
          # NOT accept, so `select<U+2003>close_idle_waiting_lobbies(15);` would
          # normalise to the expected text while erroring on every tick. Only
          # ASCII whitespace is collapsed, so a reindentation of a migration's
          # dollar-quoted literal is tolerated and nothing else is.
          bad=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc "
            with expected(jobname, schedule, command, must_exist, absent_reason) as (
              values
                ('close_idle_waiting_lobbies'::text, '*/2 * * * *'::text, 'select close_idle_waiting_lobbies(15);'::text, true, null::text),
                ('drop_stale_unconfirmed_rsvps', '*/2 * * * *', 'select drop_stale_unconfirmed_rsvps();', true, null),
                ('notification_dispatches_gc', '17 * * * *', 'delete from public.notification_dispatches where sent_at < now() - interval ''24 hours'';', true, null),
                ('open_scheduled_games_due', '* * * * *', 'select open_scheduled_games_due();', true, null),
                ('reap_idle_active_games', '*/15 * * * *', 'select public.reap_idle_active_games_tick();', $reaper_must_exist, $reaper_absent_reason),
                ('scheduled_games_push_tick', '* * * * *', null, false, 'app.api_base / app.cron_secret are unset in this stack, so a migration baked a URL and a bearer token in instead of reading them at run time'),
                ('warn_idle_waiting_lobbies', '*/2 * * * *', null, false, 'app.api_base / app.cron_secret are unset in this stack, so a migration baked a URL and a bearer token in instead of reading them at run time')
            ),
            actual as (
              select jobid, jobname, schedule, command, active, database, username, nodename, nodeport,
                     btrim(regexp_replace(command, '[ \t\r\n\f\v]+', ' ', 'g')) as norm
                from cron.job
            ),
            rogue as (
              select format('%s is in cron.job but is not a declared job (schedule %L, command %L)',
                            coalesce(a.jobname, '<a row with no jobname>'), a.schedule, a.command) as problem
                from actual a
               where a.jobname is null
                  or not exists (select 1 from expected e where e.jobname = a.jobname)
            ),
            declared as (
              select format('%s (%s)', e.jobname, checked.problem) as problem
                from expected e
                left join actual a on a.jobname = e.jobname
                cross join lateral (
                  select case
                           when a.jobid is null and e.must_exist then 'absent from cron.job'
                           when a.jobid is not null and not e.must_exist
                             then format('is in cron.job even though %s: command %L', e.absent_reason, a.command)
                           when a.jobid is null then null
                           when a.schedule is distinct from e.schedule
                             then format('schedule is %L, expected %L', a.schedule, e.schedule)
                           when a.norm is distinct from e.command
                                and btrim(regexp_replace(a.command, '\s+', ' ', 'g')) is not distinct from e.command
                             then format('command matches %L only if NON-ASCII whitespace is treated as whitespace. It contains a character such as U+2000/U+2003/U+2028/U+2029/U+3000, which Postgres regex \s matches but the SQL lexer does not -- pg_cron would raise a syntax error on every tick. Raw command: %L', e.command, a.command)
                           when a.norm is distinct from e.command
                             then format('command is %L, expected %L (ASCII whitespace normalised)', a.norm, e.command)
                           when a.active is distinct from true
                             then 'is registered but cron.job.active is false, so it never fires -- present-and-disabled is the #1167 failure mode, not a fix for it'
                           when a.database is distinct from 'postgres'
                             then format('is registered against database %L, expected %L -- a job in another database does nothing useful here', a.database, 'postgres')
                           when a.username is distinct from 'postgres'
                             then format('runs as %L, expected %L', a.username, 'postgres')
                           when a.nodename is distinct from 'localhost'
                             then format('is registered against nodename %L, expected %L -- anything else sends this job somewhere other than this server', a.nodename, 'localhost')
                           when a.nodeport is distinct from current_setting('port')::int
                             then format('is registered against nodeport %L, expected %L -- with cron.use_background_workers off pg_cron dials nodename:nodeport', a.nodeport, current_setting('port'))
                         end as problem
                ) as checked
               where checked.problem is not null
            )
            select coalesce(string_agg(problem, '; ' order by problem), '')
              from (select problem from rogue union all select problem from declared) as problems;")
          if [ -n "$bad" ]; then
            echo "::error::cron.job does not match the deploy-equivalent inventory after applying this PR's migrations: $bad"
            echo "This is the state a DEPLOY would produce -- what production runs. Unlike the HTTP cron gate below it is not overwritten by re-running the scheduling guard, so a difference here is a difference production would get. See issue #1175."
            echo "TO FIX: if a migration in this PR changed a job on purpose, update its row in the \`expected\` VALUES list in THIS step, and -- for scheduled_games_push_tick and warn_idle_waiting_lobbies -- the expectation rows in the direct-HTTP \`values\` list and the declared-jobname array of the rogue check, both in the HTTP cron gate below. If a job is new, add a row here and its name to that array. If you did not mean to change a cron job, a migration in this PR is scheduling something nobody asked for."
            exit 1
          fi

          # The reaper, byte-for-byte. The inventory above already compared it
          # with ASCII whitespace normalised; this repeats it exactly, because
          # #1166 is the regression that matters most here and because the HTTP
          # cron gate makes the identical byte-exact assertion. Anything other
          # than the bare tick invocation means the route and the CRON_SECRET
          # bearer are baked into cron.job rather than re-read each run, and the
          # function's https transport gate (CWE-319) is bypassed.
          if [ "$pg_net_available" = "t" ]; then
            bad=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc "
              select coalesce(
                       case
                         when j.jobid is null then 'absent from cron.job'
                         when j.schedule is distinct from '*/15 * * * *'
                           then format('schedule is %L, expected %L', j.schedule, '*/15 * * * *')
                         when j.command is distinct from 'select public.reap_idle_active_games_tick();'
                           then format('command is %L, expected %L', j.command, 'select public.reap_idle_active_games_tick();')
                       end, '')
                from (select 1) as one
                left join cron.job j on j.jobname = 'reap_idle_active_games';")
            if [ -n "$bad" ]; then
              echo "::error::reap_idle_active_games is wrong or missing in the cron.job state this PR's migrations produce: $bad"
              echo "It must be registered as the tick call, not as an inlined net.http_post: the URL and the CRON_SECRET bearer must be re-read at run time (rotation-safe) and must pass the function's https transport gate (CWE-319)."
              echo "TO FIX: find the migration in this PR that re-registers reap_idle_active_games and delete that registration. A LATER migration that re-registers it is what this assertion point exists to catch -- the scheduling guard is already applied on production and will not re-run to undo it. See issue #1175."
              exit 1
            fi
          fi
          echo "cron.job matches the deploy-equivalent inventory."

      # The local stack's URL and keys. These are the Supabase CLI's fixed demo credentials --
      # public, documented, identical on every developer's machine, and worthless outside this
      # container -- so they are literals here rather than secrets, and this job needs no
      # repository secrets at all.
      #
      # They are NOT read from `supabase status -o env`: as of CLI 2.108.0 that command emits
      # URLs only (API_URL, DB_URL, REST_URL, ...) and no ANON_KEY or SERVICE_ROLE_KEY, so
      # parsing it for keys yields empty strings. Verified against 2.108.0 on 2026-08-31.
      - name: Export local credentials
        run: |
          set -euo pipefail
          # The fallbacks here are load-bearing. Under `set -euo pipefail`, a `supabase status`
          # that exits non-zero or a grep that matches nothing would abort the step at the
          # assignment -- so the explanatory ::error:: below would never print and the job would
          # fail with an opaque non-zero exit. A guard whose whole purpose is to say WHY it
          # failed must not die before saying it. Capture the status output first, then parse.
          status_env=$(supabase status -o env) || status_env=''
          api_url=$(printf '%s\n' "$status_env" | { grep -E '^API_URL=' || true; } | cut -d= -f2- | tr -d '"')
          if [ -z "$api_url" ]; then
            echo "::error::supabase status reported no API_URL. Refusing to run a security gate against a half-started stack."
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$LOCAL_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$LOCAL_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Pin the failure. If a future CLI release rotates the local demo keys, every request below
      # 401s and the suite fails with a wall of confusing "denied" results that look exactly like
      # a passing security posture read wrong. Assert the anon key AUTHENTICATES -- separately
      # from what it is allowed to read -- so that day produces one clear message instead.
      - name: Verify the local keys still authenticate
        run: |
          set -euo pipefail
          # Same reasoning as the step above: a curl that cannot connect exits non-zero and would
          # abort before the ::error:: prints. Fall back to 000 so the check reports the real
          # problem. The fallback must OVERRIDE, not append: on a connection failure curl's
          # `-w '%{http_code}'` already emits 000, so an `|| echo 000` inside the substitution
          # would yield the string "000000" and a garbled diagnostic.
          code=$(curl -s --max-time 30 -o /tmp/probe.json -w '%{http_code}' \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/games?select=id&limit=1" \
            -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${NEXT_PUBLIC_SUPABASE_ANON_KEY}") || code=000
          if [ "$code" != "200" ]; then
            echo "::error::The anon key could not read games.id (HTTP $code). The Supabase CLI's local demo keys have probably changed -- update LOCAL_ANON_KEY / LOCAL_SERVICE_ROLE_KEY in this job. Response: $(head -c 300 /tmp/probe.json)"
            exit 1
          fi

      # Hosted-parity grant for the SERVICE role, and only the service role.
      #
      # `20260803160000_default_privileges_lockdown.sql` uses ALTER DEFAULT PRIVILEGES, which
      # applies to FUTURE objects only, so tables created by earlier migrations never received
      # these grants on a database built from scratch. The hosted projects have them (they were
      # granted when those tables were created, under the defaults of the day); a fresh
      # `supabase start` does not. Without this, the suite's own write-probe control fails with
      # `permission denied for table api_rate_limit_attempts` before it can probe anything.
      #
      # This CANNOT weaken any assertion in the suite. Every assertion is about `anon`, this
      # touches only `service_role`, and the service role is the suite's known-POSITIVE control:
      # it is supposed to be able to do everything, and the file is built on that. Never extend
      # this to anon -- that would re-grant the very columns the redaction migrations revoked and
      # turn the gate into a rubber stamp.
      - name: Grant the service role hosted-parity access
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -c "grant all privileges on all tables in schema public to service_role;" \
            -c "grant all privileges on all sequences in schema public to service_role;"

      # The suite needs at least one readable row to inspect: its column sweep can only report on
      # tables it actually read, and a stack where every table is empty proves nothing. One game
      # row is enough. `host_token` is deliberately a real-shaped value — it is one of the columns
      # the redaction assertions expect anon to be denied.
      - name: Seed one probe row
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c \
            "insert into public.games (id, title, host_token) values ('rls-ci-probe', 'RLS CI probe', 'ci-probe-host-token') on conflict (id) do nothing;"

      # Diagnostic, not a gate. `20260803160000_default_privileges_lockdown.sql` uses ALTER DEFAULT
      # PRIVILEGES, which applies to FUTURE objects only, so tables created by earlier migrations
      # can end up with an RLS SELECT policy but no anon grant here while the hosted projects have
      # both. That difference does not make this job unsound -- the suite's positive controls fail
      # loudly on it rather than passing vacuously -- but when it does fail, this table is the
      # first thing to read.
      - name: Report anon grant coverage
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c \
            "select count(*) filter (where has_table_privilege('anon', c.oid, 'SELECT')) as anon_readable, count(*) as total_tables from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r';"

      # Exercises the idle-reaper migration AND its tick function's guard BRANCHES,
      # which nothing else can: `supabase start` applies
      # 20261123120000_reap_idle_active_games_cron.sql exactly once, with both GUCs
      # unset, and never calls the tick -- so the guard branches never execute there,
      # and the whole class of bug behind issue #1167 is a guard branch that silently
      # did the wrong thing for 17 days.
      #
      # The shape changed with the fix for that issue. The migration no longer reads
      # the GUCs: it schedules reap_idle_active_games UNCONDITIONALLY (given pg_cron)
      # and public.reap_idle_active_games_tick() does the configuration and transport
      # checks at RUN time. So the cases assert two different things:
      #   * after the migration, the job EXISTS regardless of GUCs; and
      #   * the guards fire inside the tick, which is invoked directly.
      #
      # Cases, in this order (each first clears the job so a leftover registration
      # from the previous case cannot make the next one pass vacuously):
      #   0. Migration with no GUCs -> the job is scheduled anyway. This is the
      #      structural property the old design lacked.
      #   0b. Neither anon nor authenticated may EXECUTE the tick, i.e. it is not
      #      exposed as a PostgREST RPC to anyone holding the public anon key.
      #   1. Tick with GUCs unset  -> warns, names both settings, makes no request.
      #   2/2b/2c. Tick with http:// to a remote host (including a host that merely
      #      CONTAINS "localhost", and an invalid 127.x quad) -> warns, refuses to
      #      send CRON_SECRET in cleartext, makes no request. (CWE-319 gate.)
      #   3. Tick with http:// loopback -> allowed; the documented narrow exception.
      #   4. Tick with https:// -> request made; and the job is asserted for schedule
      #      + command independently of the migration's own assertion, so a future
      #      edit that drops that check cannot make this gate pass.
      #   5. REGRESSION for #1167: apply the migration with NO GUCs, then set them,
      #      then tick -> the request happens with no re-migration of any kind.
      #
      # Fail-safe on environment, strict on defects: connectivity is hard-failed first
      # (a `supabase start` flake must not turn this gate into a green no-op), and the
      # extensions are soft-skipped ONLY when a follow-up probe proves they are genuinely
      # absent from the image.
      - name: Idle-reaper cron guard branches are exercised
        run: |
          set -euo pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          MIG=supabase/migrations/20261123120000_reap_idle_active_games_cron.sql
          JOB=reap_idle_active_games
          TICK="select public.reap_idle_active_games_tick();"

          if ! psql "$DB" -v ON_ERROR_STOP=1 -q -c "select 1;" >/dev/null; then
            echo "::error::Cannot reach the local Postgres at 127.0.0.1:54322. Refusing to run the idle-reaper cron guard gate against a half-started stack."
            exit 1
          fi

          if ! psql "$DB" -v ON_ERROR_STOP=1 -q \
              -c "create extension if not exists pg_cron;" \
              -c "create extension if not exists pg_net;"; then
            # The connection was healthy a moment ago, so narrow the cause before
            # skipping: only "not available in this image" is an environment difference.
            if ! unavailable=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc \
                "select coalesce(string_agg(e, ', '), '') from unnest(array['pg_cron','pg_net']) e where not exists (select 1 from pg_available_extensions a where a.name = e);"); then
              echo "::error::create extension failed and the follow-up availability probe could not connect either. Refusing to skip the idle-reaper cron guard gate on an unhealthy stack."
              exit 1
            fi
            if [ -z "$unavailable" ]; then
              echo "::error::create extension failed even though pg_cron and pg_net are both listed in pg_available_extensions. That is a real failure, not an environment difference."
              exit 1
            fi
            echo "::warning::Not available in this local stack: $unavailable -- idle-reaper cron guard gate skipped."
            exit 0
          fi

          # `alter database ... set app.api_base` needs superuser for a custom
          # placeholder parameter and the local `postgres` role is not one, so the GUCs
          # are set at SESSION level in the SAME psql session that then runs the tick.
          # psql runs repeated -c/-f options in order on one connection, so the SETs are
          # still in effect for the call that follows -- and that is also why a case's
          # SET cannot leak into another case's psql invocation.
          clear_job() {
            psql "$DB" -v ON_ERROR_STOP=1 -q -c "select cron.unschedule(jobid) from cron.job where jobname = '$JOB';" >/dev/null
          }
          job_count() {
            psql "$DB" -v ON_ERROR_STOP=1 -tAc "select count(*) from cron.job where jobname = '$JOB';"
          }
          apply_migration() {
            psql "$DB" -v ON_ERROR_STOP=1 -f "$MIG" 2>&1
          }
          expect_scheduled() {
            local n; n=$(job_count)
            if [ "$n" != "1" ]; then
              echo "::error::$1: expected exactly one $JOB row in cron.job, found $n. Since #1167 the migration must schedule the job unconditionally -- configuration is checked inside the tick, not at migration time."
              exit 1
            fi
          }
          expect_warning() {
            if ! printf '%s\n' "$2" | grep -qF "$1"; then
              echo "::error::The guard did not emit the expected warning. Wanted to find: $1"
              echo "::error::Actual psql output follows."
              printf '%s\n' "$2"
              exit 1
            fi
          }
          # Every refusal path in the tick raises a "REAPER CRON GUARD" warning and
          # returns before net.http_post, so the ABSENCE of that string is what proves
          # the tick reached the request. The pg_net request-id sequence is then checked
          # as the positive half: it advances on http_post and is immune to the pg_net
          # background worker draining net.http_request_queue mid-check, which a row
          # count would not be.
          #
          # The sequence is resolved through pg_get_serial_sequence() rather than being
          # spelled out. net.http_request_queue declares `id bigserial`, so the backing
          # sequence is the auto-generated net.http_request_queue_id_seq -- but that name
          # is an implementation detail of pg_net's DDL, and hardcoding it means a rename
          # upstream silently turns this whole assertion into dead code instead of failing.
          # An unresolvable sequence is a HARD failure in expect_request_made below for
          # the same reason: a ::warning:: in an otherwise-green job is nobody's stop
          # sign. Case 1's negative check deliberately warns instead -- see the comment
          # there for why, and note Case 3 hard-fails on the same probe. A sequence that
          # has never been drawn from reads as 'unused', which still compares unequal to
          # the first real value, so the advance check works from a cold database too.
          #
          # Soundness caveat, deliberately accepted: an advance proves that SOME request
          # was enqueued in the window, not that it was THIS tick's. Case 0 leaves
          # reap_idle_active_games registered for the rest of this step, so a real pg_cron
          # tick could in principle move the sequence underneath us. It cannot today --
          # CI never sets the GUCs at DATABASE level, so pg_cron's own connection always
          # takes the "settings unset" early return and enqueues nothing -- but that is a
          # coincidence propping up an assertion, so if these cases ever start flapping,
          # this is the reason. Case 1's negative check carries the mirror-image risk: a
          # concurrent enqueue would make it fail rather than pass, i.e. it fails safe.
          # request_seq runs inside $( ), so it cannot hand its diagnosis back in a
          # variable -- the assignment would die with the subshell. psql's stderr goes
          # to a file instead, so the hard failure below can say WHY the probe broke:
          # relation absent, permission denied and connection refused all collapse to
          # "unavailable" otherwise.
          #
          # Each probe writes to its OWN file, named by the caller. A single shared file
          # would be truncated by every later call including the successful ones, so the
          # common failure shape -- `before` fails, the tick runs, `after` succeeds -- would
          # leave the diagnosis empty and send the reader down the "pg_get_serial_sequence
          # returned NULL" path for what was really a connection blip.
          SEQ_ERR_BEFORE="$(mktemp)"
          SEQ_ERR_AFTER="$(mktemp)"
          Q_ERR="$(mktemp)"
          request_seq() {
            # $1 = file this probe's psql stderr is captured in
            psql "$DB" -v ON_ERROR_STOP=1 -tAc \
              "select case
                        when pg_get_serial_sequence('net.http_request_queue', 'id') is null then 'unavailable'
                        else coalesce(
                          pg_sequence_last_value(pg_get_serial_sequence('net.http_request_queue', 'id')::regclass)::text,
                          'unused')
                      end;" 2>"$1" || echo unavailable
          }
          seq_err() {
            # $1 = the stderr file of the probe being quoted
            local e; e=$(tr -s '\n' ' ' < "$1")
            if [ -z "${e// /}" ]; then
              echo "psql reported no error, so pg_get_serial_sequence('net.http_request_queue', 'id') returned NULL -- the pg_net queue table or its identity column is not what this probe expects."
            else
              echo "$e"
            fi
          }
          expect_request_made() {
            # $1 = case label, $2 = psql output, $3 = sequence value before the tick,
            # $4 = the file holding THAT probe's stderr (pairing the value with its own
            # diagnosis here rather than assuming $SEQ_ERR_BEFORE, so a future caller
            # probing into a different file cannot get a confidently wrong quote).
            if printf '%s\n' "$2" | grep -qF 'REAPER CRON GUARD'; then
              echo "::error::$1: the tick emitted a guard warning and therefore made no request, but this configuration must be accepted."
              printf '%s\n' "$2"
              exit 1
            fi
            local after; after=$(request_seq "$SEQ_ERR_AFTER")
            if [ "$3" = unavailable ] || [ "$after" = unavailable ]; then
              # Quote the probe (or probes) that actually came back unavailable -- never
              # whichever one happened to run last.
              local why
              if [ "$3" = unavailable ] && [ "$after" = unavailable ]; then
                why="Both probes failed. The before probe said: $(seq_err "$4") -- the after probe said: $(seq_err "$SEQ_ERR_AFTER")"
              elif [ "$3" = unavailable ]; then
                why="The before probe (the one that failed) said: $(seq_err "$4")"
              else
                why="The after probe (the one that failed) said: $(seq_err "$SEQ_ERR_AFTER")"
              fi
              echo "::error::$1: the pg_net request-id sequence behind net.http_request_queue.id could not be read ($3 -> $after), so the positive half of this assertion cannot run. Fix the probe rather than ignoring it -- without it these cases only prove that no guard warning was printed. $why"
              exit 1
            fi
            if [ "$after" = "$3" ]; then
              echo "::error::$1: the tick warned about nothing but the pg_net request sequence did not advance ($3 -> $after), so no request was enqueued."
              exit 1
            fi
          }

          echo '--- Case 0: the migration schedules the job even with both GUCs unset'
          clear_job
          out=$(apply_migration) || { echo "::error::The migration failed to apply with the GUCs unset; it must not depend on them at all."; printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          expect_scheduled 'Case 0 (migration, GUCs unset)'

          echo '--- Case 0b: the tick is not reachable as a PostgREST RPC'
          # Asserted positively: the ONLY passing answer is the literal "false". A
          # missing role, an empty result or a dead psql all fail here rather than
          # printing a reassuring line, because every one of those states means the
          # gate stopped testing the thing it exists to catch while the function may
          # still be PUBLIC-executable. has_function_privilege() does resolve
          # PUBLIC-derived privileges, so this genuinely tests the revoke.
          #
          # psql's stderr goes to its own file rather than being merged with 2>&1: the
          # merge is only wanted on the failure path, and on a SUCCESSFUL run any notice
          # libpq prints (a client/server version mismatch, say) would be prepended to
          # the value and fail the "exactly false" assertion for no reason.
          for role in anon authenticated; do
            granted=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc \
              "select case when to_regrole('$role') is null then 'no-role'
                           else has_function_privilege('$role', 'public.reap_idle_active_games_tick()', 'execute')::text end;" 2>"$Q_ERR") \
              || granted="probe-failed: $(tr -s '\n' ' ' < "$Q_ERR")"
            # Keep any stderr from a SUCCESSFUL probe visible in the step log instead of
            # discarding it; on the failure path it is already inside $granted.
            case "$granted" in
              probe-failed:*) ;;
              *)
                if [ -s "$Q_ERR" ]; then
                  echo "  note: psql wrote to stderr while probing $role: $(tr -s '\n' ' ' < "$Q_ERR")"
                fi
                ;;
            esac
            if [ "$granted" != "false" ]; then
              echo "::error::Case 0b: expected has_function_privilege('$role', 'public.reap_idle_active_games_tick()', 'execute') to be exactly false, got '$granted'. Postgres grants EXECUTE to PUBLIC by default, so a zero-arg function in the public schema is a POST /rest/v1/rpc/ endpoint for anyone with the anon key -- the migration must revoke it, and this check must be able to prove that it did."
              exit 1
            fi
            echo "  $role -> $granted"
          done

          echo '--- Case 1: tick with both GUCs unset -> loud skip, no request'
          before=$(request_seq "$SEQ_ERR_BEFORE")
          out=$(psql "$DB" -v ON_ERROR_STOP=1 -c "$TICK" 2>&1) || { echo "::error::The tick failed with the GUCs unset; a missing setting must warn, not error."; printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          expect_warning 'REAPER CRON GUARD: the idle-active-game reaper (reap_idle_active_games) made NO request because required database settings are unset: app.api_base, app.cron_secret' "$out"
          # Deliberate asymmetry with expect_request_made, which HARD-fails on an
          # unreadable probe: this is a NEGATIVE check, so an unreadable probe costs it
          # its evidence and it declines to conclude anything rather than guessing.
          #
          # BOTH values have to be guarded, not just $before. An unreadable after-probe
          # returns the literal string "unavailable", which compares unequal to a
          # perfectly good "$before" -- so testing only $before would fire this branch on
          # a connection blip and report that the guard leaked a request when nothing was
          # enqueued, which is the exact false diagnosis the rest of this commit exists to
          # eliminate.
          #
          # The skip is not silent: the probe's own stderr is quoted, and Case 3 hard-fails
          # on this same probe further down (after cases 2/2b/2c), so a genuinely broken
          # probe still stops the job rather than quietly hollowing this assertion out.
          after=$(request_seq "$SEQ_ERR_AFTER")
          if [ "$before" = unavailable ] || [ "$after" = unavailable ]; then
            if [ "$before" = unavailable ] && [ "$after" = unavailable ]; then
              why="both probes failed -- the before probe said: $(seq_err "$SEQ_ERR_BEFORE") -- the after probe said: $(seq_err "$SEQ_ERR_AFTER")"
            elif [ "$before" = unavailable ]; then
              why="the before probe said: $(seq_err "$SEQ_ERR_BEFORE")"
            else
              why="the after probe said: $(seq_err "$SEQ_ERR_AFTER")"
            fi
            echo "::warning::Case 1 (GUCs unset): the pg_net request sequence could not be read ($before -> $after), so the no-request half of this case is unproven -- the guard warning matched above is all it asserts. Diagnosis: $why"
          elif [ "$after" != "$before" ]; then
            echo "::error::Case 1 (GUCs unset): the pg_net request sequence advanced ($before -> $after), so a request was enqueued despite the guard warning."
            exit 1
          fi

          echo '--- Case 2: plaintext http:// to a remote host -> refused (CWE-319)'
          out=$(psql "$DB" -v ON_ERROR_STOP=1 \
            -c "set app.api_base = 'http://reaper-ci.example.com';" \
            -c "set app.cron_secret = 'ci-not-a-real-secret';" \
            -c "$TICK" 2>&1) || { echo "::error::The tick failed with a plaintext api_base; it must warn and skip, not error."; printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          expect_warning 'refusing to send the CRON_SECRET bearer token in cleartext to a non-loopback host' "$out"

          # A host check, not a substring check: this URL contains "localhost" but is not
          # one, so it must still be refused. This is the case a naive `like '%localhost%'`
          # carve-out would wave through.
          echo '--- Case 2b: a remote http:// host that merely CONTAINS "localhost" -> still refused'
          out=$(psql "$DB" -v ON_ERROR_STOP=1 \
            -c "set app.api_base = 'http://localhost.reaper-ci.example.com';" \
            -c "set app.cron_secret = 'ci-not-a-real-secret';" \
            -c "$TICK" 2>&1) || { echo "::error::The tick failed for case 2b; it must warn and skip, not error."; printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          expect_warning 'refusing to send the CRON_SECRET bearer token in cleartext to a non-loopback host' "$out"

          # Not a dotted quad, so libcurl inside pg_net would DNS-resolve it as a NAME
          # and could reach a non-loopback address. A loose [0-9]{1,3} octet pattern
          # would wave this through and leak the CRON_SECRET bearer in cleartext.
          echo '--- Case 2c: an invalid 127.x quad (http://127.999.999.999) -> still refused'
          out=$(psql "$DB" -v ON_ERROR_STOP=1 \
            -c "set app.api_base = 'http://127.999.999.999';" \
            -c "set app.cron_secret = 'ci-not-a-real-secret';" \
            -c "$TICK" 2>&1) || { echo "::error::The tick failed for case 2c; it must warn and skip, not error."; printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          expect_warning 'refusing to send the CRON_SECRET bearer token in cleartext to a non-loopback host' "$out"

          # The job must still be there after every refusal: a bad GUC makes the tick
          # decline to send, it does not unregister anything.
          expect_scheduled 'Cases 1-2c (refusals must not unschedule the job)'

          echo '--- Case 3: http:// loopback -> allowed (the documented narrow exception)'
          before=$(request_seq "$SEQ_ERR_BEFORE")
          out=$(psql "$DB" -v ON_ERROR_STOP=1 \
            -c "set app.api_base = 'http://127.0.0.1:3000';" \
            -c "set app.cron_secret = 'ci-not-a-real-secret';" \
            -c "$TICK" 2>&1) || { echo "::error::Case 3 (loopback http): the tick errored. Loopback http:// is the documented exception -- infra/templates/user-data.sh.tftpl relies on it."; printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          expect_request_made 'Case 3 (loopback http)' "$out" "$before" "$SEQ_ERR_BEFORE"

          echo '--- Case 4: https:// -> request made, and the job asserted independently of the migration'
          before=$(request_seq "$SEQ_ERR_BEFORE")
          out=$(psql "$DB" -v ON_ERROR_STOP=1 \
            -c "set app.api_base = 'https://reaper-ci.example.invalid';" \
            -c "set app.cron_secret = 'ci-not-a-real-secret';" \
            -c "$TICK" 2>&1) || { echo "::error::Case 4 (https): the tick errored."; printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          expect_request_made 'Case 4 (https)' "$out" "$before" "$SEQ_ERR_BEFORE"
          psql "$DB" -v ON_ERROR_STOP=1 -c "select jobname, schedule, command from cron.job order by jobname;"
          bad=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc "
            select coalesce(
                     case
                       when j.jobid is null then 'absent from cron.job'
                       when j.schedule is distinct from '*/15 * * * *'
                         then format('schedule is %L, expected %L', j.schedule, '*/15 * * * *')
                       when j.command is distinct from 'select public.reap_idle_active_games_tick();'
                         then format('command is %L, expected the reap_idle_active_games_tick() call', j.command)
                     end, '')
              from (select 1) as one
              left join cron.job j on j.jobname = '$JOB';")
          if [ -n "$bad" ]; then
            echo "::error::Case 4 (https): $JOB is wrong or missing in cron.job: $bad"
            echo "This is the failure mode from issue #1167 -- a scheduling block that reports success and schedules nothing (or schedules the wrong thing)."
            echo "TO FIX: if the change was intended, update the expectation row for this job in THIS step and its row in the \`expected\` VALUES list of \`cron.job matched the deploy-equivalent inventory\` above. A job whose command no longer matches is either a migration that repointed it or one that registered it with the URL and bearer baked in."
            exit 1
          fi

          # THE regression test for #1167. The old design read the GUCs at migration
          # time, so a database migrated before they were set stayed unscheduled
          # forever: the migration was already recorded as applied and would not
          # re-run. Here the migration is applied with nothing set, the settings
          # arrive afterwards in a different session, and the tick must go through --
          # without the file being applied again.
          echo '--- Case 5: GUCs set AFTER the migration -> the tick works with no re-migration'
          clear_job
          out=$(apply_migration) || { echo "::error::Case 5: the migration failed to apply with the GUCs unset."; printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          expect_scheduled 'Case 5 (migration applied with no GUCs)'
          before=$(request_seq "$SEQ_ERR_BEFORE")
          out=$(psql "$DB" -v ON_ERROR_STOP=1 \
            -c "set app.api_base = 'https://reaper-ci.example.invalid';" \
            -c "set app.cron_secret = 'ci-not-a-real-secret';" \
            -c "$TICK" 2>&1) || { echo "::error::Case 5: the tick errored after the GUCs were set."; printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          expect_request_made 'Case 5 (GUCs set after the migration)' "$out" "$before" "$SEQ_ERR_BEFORE"

          echo "All idle-reaper guard branches behaved as specified."

      - run: pnpm vitest run src/lib/rls-boundaries.integration.test.ts

      # The enforcement half of `cron.job matches the deploy-equivalent
      # inventory`. That step runs with `continue-on-error` so that a cron
      # finding cannot abort this job before the RLS boundary suite -- the gate
      # this job exists for -- but its verdict still has to be binding, and it
      # has to be read from something the steps in between cannot rewrite.
      #
      # `steps.<id>.outcome` is exactly that: the runner records it when the step
      # ends, and no later step can change it. That is the whole reason the
      # inventory is asserted up there against the live database instead of being
      # written to a file for this step to judge -- a CSV plus a SHA-256 sidecar
      # in RUNNER_TEMP was forged in about fifteen lines by the vitest suite that
      # runs in between, which the pull request owns.
      #
      # `if: always()` so the cron verdict is reported even when the RLS suite
      # failed; a failure there still fails the job on its own.
      - name: The deploy-equivalent cron gate must have passed
        if: always()
        env:
          CRON_GATE_OUTCOME: ${{ steps.deploy_cron_state.outcome }}
          # Load-bearing, not hygiene. Without it the RLS suite immediately
          # above -- which the pull request owns -- writes BASH_ENV=/tmp/x.sh to
          # $GITHUB_ENV, and that file re-exports CRON_GATE_OUTCOME=success
          # inside this step's own shell, turning a failed inventory green. The
          # runner's record of the outcome is unforgeable; the shell that reads
          # it was not. See the note on the anchor step.
          BASH_ENV: ''
        run: |
          set -euo pipefail
          case "$CRON_GATE_OUTCOME" in
            success)
              echo "The deploy-equivalent cron inventory passed."
              ;;
            skipped|'')
              echo "::error::\`cron.job matches the deploy-equivalent inventory\` did not run (outcome: '${CRON_GATE_OUTCOME:-<unset>}'). It must stay immediately after \`supabase start\`, before anything mutates cron.job -- without it nothing in CI checks what a deploy would schedule."
              exit 1
              ;;
            *)
              echo "::error::\`cron.job matches the deploy-equivalent inventory\` failed (outcome: $CRON_GATE_OUTCOME). Scroll up to that step for the specific difference: it is the state a DEPLOY would produce, so it is what production would run."
              exit 1
              ;;
          esac

      # ── HTTP cron scheduling gate (issue #1167) ──────────────────────────────
      # The scheduling migrations no-op silently when `app.api_base` /
      # `app.cron_secret` are unset. On production they WERE unset, so
      # `scheduled_games_push_tick`, `warn_idle_waiting_lobbies` and
      # `reap_idle_active_games` were never scheduled -- for months, with no
      # failing check anywhere.
      #
      # A "the jobs exist" assertion against this stack as-is would be vacuous:
      # the GUCs are unset here too, and a no-op is CORRECT in that state. So
      # this step creates the state the assertion is actually about -- it sets
      # both GUCs, re-executes the scheduling block, and then requires the jobs
      # to be in cron.job. That makes the guard's happy path a tested path: a
      # typo'd jobname, a broken precondition test, or a scheduling call that
      # silently does nothing fails HERE instead of on a hosted project.
      #
      # It does NOT and CANNOT assert that the hosted projects have the GUCs
      # set. Nothing in CI can see a hosted project's settings; that check has
      # to live post-deploy (see the PR for #1167).
      #
      # NOR IS IT THE DEPLOY-EQUIVALENT ASSERTION, and it must never be treated
      # as one (issue #1175). By the time it asserts, it has re-run the guard
      # migration, which unconditionally unschedules and reschedules all three
      # jobs from literals in its own file -- so what it sees is what it just
      # wrote, one statement earlier, not what this PR's migration set produces.
      # On production 20261124 is already applied and will not re-run, so a
      # LATER migration is what wins there; here it is force-re-run last, so it
      # always wins. That question is answered by
      # `cron.job matches the deploy-equivalent inventory`, which asserts
      # immediately after `supabase start` and BEFORE anything in this job has
      # touched cron.job. Keep both: this step proves the guard's scheduling path
      # still works, that one proves a deploy schedules the right things. If this
      # step is red the guard migration is broken; if that one is red a migration
      # in the PR changed what production would run.
      #
      # Runs LAST, after the RLS suite, because it mutates the database (it
      # registers cron jobs) and must not perturb the security gate that is this
      # job's main purpose.
      #
      # Fail-safe on environment, strict on defects: if pg_cron/pg_net are
      # genuinely absent from this stack (a self-hosted or future CLI image
      # without them preloaded), the step warns and exits 0 rather than turning
      # an unrelated image change into a red required check. Everything after
      # that point is hard-asserted -- and the soft-skip is scoped strictly to
      # "the extensions are unavailable", never to "psql exited non-zero", so a
      # `supabase start` flake cannot quietly turn this gate into a green no-op.
      - name: HTTP cron jobs are scheduled once the GUCs are set
        env:
          # Runner-held state from the deploy-equivalent step, not a file any
          # step in between could rewrite.
          CRON_REAPPLY_MIGRATIONS: ${{ steps.deploy_cron_state.outputs.reapply }}
          CRON_REAPPLY_COMPUTED: ${{ steps.deploy_cron_state.outputs.computed }}
          # Otherwise a BASH_ENV file set via $GITHUB_ENV by any earlier step
          # can define a shell function named `psql` that shadows the binary for
          # every assertion below. See the note on the anchor step.
          BASH_ENV: ''
        run: |
          set -euo pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          GUARD_MIGRATION=supabase/migrations/20261124120000_noisy_http_cron_scheduling_guard.sql

          # Connectivity first, and HARD-FAIL on it. `psql` exits non-zero for
          # any reason at all -- "could not connect to server", auth failure, a
          # wedged stack -- so a bare `create extension` probe cannot tell "this
          # image has no pg_cron" from "the stack never came up". Treating both
          # as skippable would let a `supabase start` flake turn this whole gate
          # into a green no-op with a warning nobody reads, which is precisely
          # the silent-skip class this step exists to eliminate. Same precedent
          # as "Refusing to run a security gate against a half-started stack"
          # earlier in this job.
          if ! psql "$DB" -v ON_ERROR_STOP=1 -q -c "select 1;" >/dev/null; then
            echo "::error::Cannot reach the local Postgres at 127.0.0.1:54322. Refusing to run the HTTP cron scheduling gate against a half-started stack."
            exit 1
          fi

          if ! psql "$DB" -v ON_ERROR_STOP=1 -q \
              -c "create extension if not exists pg_cron;" \
              -c "create extension if not exists pg_net;"; then
            # The connection was healthy a moment ago, so narrow the cause
            # before skipping: only "the extension is not available in this
            # image" is an environment difference. Anything else -- including
            # the connection dying in between -- is a real failure.
            if ! unavailable=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc \
                "select coalesce(string_agg(e, ', '), '') from unnest(array['pg_cron','pg_net']) e where not exists (select 1 from pg_available_extensions a where a.name = e);"); then
              echo "::error::create extension failed and the follow-up availability probe could not connect either. Refusing to skip the HTTP cron scheduling gate on an unhealthy stack."
              exit 1
            fi
            if [ -z "$unavailable" ]; then
              echo "::error::create extension failed even though pg_cron and pg_net are both listed in pg_available_extensions. That is a real failure, not an environment difference."
              exit 1
            fi
            echo "::warning::Not available in this local stack: $unavailable -- HTTP cron scheduling gate skipped."
            exit 0
          fi

          # Set the two GUCs at SESSION level, in the SAME psql session that then
          # runs the guard. `alter database postgres set app.api_base = ...` does
          # not work here: `app.api_base` is a custom placeholder parameter, and
          # PostgreSQL only lets a superuser attach one of those to a database or
          # role. The local stack's `postgres` role is not a superuser, so that
          # form fails with `permission denied to set parameter "app.api_base"`.
          # A session-level SET carries no such restriction and is read back by
          # `current_setting('app.api_base', true)` in the same connection, which
          # is exactly what the guard's do-block reads -- so this creates the same
          # precondition state without needing superuser.
          #
          # psql executes repeated -c/-f options in the order given, all on one
          # connection, so the two SETs are still in effect when the -f runs.
          # (This is also why they cannot be split across psql invocations: unlike
          # a database-level setting, a session SET dies with its connection.)
          #
          # Re-run the guard migration with the preconditions satisfied. Its own
          # assertion raises, and ON_ERROR_STOP turns that into a failed step.
          #
          # The two fixture values are shell variables rather than repeated
          # literals because the expected COMMAND text below is derived from
          # them: the guard builds each job's command with
          # `format($sql$ ... %L ... $sql$, api_base || '<route>', 'Bearer ' || cron_secret)`,
          # so with both GUCs pinned here the command is fully deterministic and
          # can be compared in full rather than sniffed for substrings. If these
          # two values and the expectations below ever drift apart, the gate
          # fails closed.
          API_BASE='http://127.0.0.1:3000'
          CRON_SECRET='ci-not-a-real-secret'

          # Re-running ONLY the guard is not enough (issue #1175). On production
          # the guard is already applied; what actually runs on a deploy is the
          # migrations that come AFTER it, and those are the ones that get the
          # last word on cron.job. A new migration that copy-pastes the
          # GUC-gated scheduling block out of 20261005120000 or 20261015120000 --
          # the idiomatic way to add one -- no-ops during `supabase start`
          # because CI never sets the GUCs at database level, so the
          # deploy-equivalent snapshot correctly sees nothing, and it would never
          # be executed with the GUCs set anywhere in this job either. It could
          # point scheduled_games_push_tick at any host with the real bearer and
          # stay green. So: apply them here too, in order, in this same GUC-set
          # session, exactly as production would.
          #
          # WHICH migrations, and why not by grepping them for `cron.`: that
          # predicate missed `SELECT CRON.schedule(...)`,
          # `select "cron"."schedule"(...)`, a newline before the dot,
          # `set search_path = cron` and string concatenation -- all of which
          # schedule a job -- while matching migrations whose only mention of
          # cron was in an English comment, which would then be re-executed for
          # nothing. So the list is computed WITHOUT reading the files: it is
          # exactly the migrations this branch ADDS that sort after the guard,
          # written out by `cron.job matched the deploy-equivalent inventory`
          # from `git diff --diff-filter=A` against the base revision. Those are
          # precisely the files production applies after the already-recorded
          # guard, whatever SQL they happen to contain.
          #
          # The cost of not reading them is that a migration which is not safe to
          # apply twice fails here. That is a real constraint on post-guard
          # migrations and it is deliberate: the alternative is a lexical filter,
          # and this is the third round of narrowing one. The failure names the
          # file and says what to do.
          # The list arrives as a STEP OUTPUT of `cron.job matches the
          # deploy-equivalent inventory`, not as a file. The runner holds step
          # outputs; the steps in between -- including the PR-owned vitest suite
          # -- cannot rewrite one. A file in RUNNER_TEMP could simply be emptied,
          # which would silently restore the bypass this re-application closes.
          if [ "$CRON_REAPPLY_COMPUTED" != "yes" ]; then
            echo "::error::\`cron.job matches the deploy-equivalent inventory\` did not publish a re-apply list. It must run immediately after \`supabase start\`; without it this gate cannot know which of this PR's migrations production applies after the scheduling guard."
            exit 1
          fi
          later_cron_migrations=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then
              echo "::error::$f is listed for re-application but is not in the checkout."
              exit 1
            fi
            echo "Also applying $f with both GUCs set (it applies after the guard on production too)."
            later_cron_migrations+=(-f "$f")
          done <<< "$CRON_REAPPLY_MIGRATIONS"

          # psql runs repeated -c/-f options in order on one connection, so the
          # two SETs are still in effect for every -f that follows.
          if ! psql "$DB" -v ON_ERROR_STOP=1 \
              -c "set app.api_base = '$API_BASE';" \
              -c "set app.cron_secret = '$CRON_SECRET';" \
              -f "$GUARD_MIGRATION" \
              ${later_cron_migrations[@]+"${later_cron_migrations[@]}"}; then
            echo "::error::Re-applying the scheduling guard (and any migration this branch adds after it) with both GUCs set failed."
            echo "If the failure is from one of the migrations listed above rather than from the guard's own assertion, that migration is not safe to apply twice. This gate has to run post-guard migrations with the GUCs set -- CI never sets them at database level, so a GUC-gated scheduling block is otherwise never executed anywhere in CI and could point a cron job at any host with the real bearer. Make the migration idempotent (\`if not exists\`, \`or replace\`, \`on conflict do nothing\`)."
            exit 1
          fi

          echo "Scheduled cron jobs:"
          psql "$DB" -v ON_ERROR_STOP=1 -c "select jobname, schedule, active, database, username, nodename, command from cron.job order by jobname, jobid;"

          # The expected command text, built from the same two fixture values
          # that were just fed to the guard. Single quotes are doubled for the
          # SQL literal below; these values contain none today, and doing it
          # anyway keeps a future edit to them from silently breaking the query.
          expected_push="select net.http_post( url := '$API_BASE/api/scheduled/tick', headers := jsonb_build_object('Content-Type', 'application/json', 'Authorization', 'Bearer $CRON_SECRET') );"
          expected_warn="select net.http_post( url := '$API_BASE/api/cron/warn-idle-lobbies', headers := jsonb_build_object('Content-Type', 'application/json', 'Authorization', 'Bearer $CRON_SECRET') );"
          expected_push_sql=${expected_push//\'/\'\'}
          expected_warn_sql=${expected_warn//\'/\'\'}

          # Independent of the migration's internal check, so a future edit that
          # drops that check still cannot make this gate pass vacuously.
          #
          # Asserts DEFINITION, not just existence. `jobname in (...)` alone
          # still passes if someone flips a cron expression to '0 0 * * *',
          # repoints a URL at the wrong route, or drops the Authorization
          # header -- and these job definitions are copy-pasted between
          # migration files with nothing keeping them in sync, so drift is the
          # likeliest regression.
          #
          # The command is compared IN FULL against the text the guard must have
          # produced from the two fixture GUCs, with runs of whitespace
          # collapsed. It used to be two `position(... in command) <> 0`
          # substring tests, which issue #1175 showed pass on: a route repointed
          # to `/api/scheduled/tickle` (the expected route is a prefix of it);
          # the route and the word `Authorization` appearing only inside an SQL
          # comment while the real call posts to an attacker host; a
          # `jsonb_build_object('X-Note','Authorization removed')` header with no
          # bearer at all; `net.http_get` in place of `net.http_post`; and the
          # bare `select '/api/scheduled/tick Authorization';`. A full comparison
          # rejects every one of them, and subsumes "the bearer is present and
          # non-empty" -- the exact bearer is part of the compared text.
          #
          # Whitespace is normalised, and only whitespace: the command comes from
          # a dollar-quoted literal in the migration, so reindenting that file
          # must not red CI, while every other byte -- method, scheme, host,
          # path, header names and values -- must match exactly.
          #
          # `active`, `database`, `username` and `nodename` are checked too. A
          # job that is present and correctly defined but `active = false` never
          # fires, which is #1167's "the jobs exist, nothing runs" failure mode
          # reproduced through the gate; and one registered via
          # `cron.schedule_in_database(..., database := 'template1')` (or against
          # another nodename) satisfies every definition check while doing
          # nothing useful in production.
          #
          # Only the two jobs whose COMMAND is the HTTP call are checked this
          # way. reap_idle_active_games is registered as the single call
          # `select public.reap_idle_active_games_tick();` (#1166): its route,
          # bearer token and 90s timeout live inside the function body and are
          # re-read every run, precisely so that a URL/secret rotation cannot
          # leave a stale value baked into cron.job and so that the function's
          # https transport gate cannot be bypassed. A route/Authorization
          # substring test therefore cannot pass for it and must not be
          # reintroduced -- it is asserted by exact command match below.
          bad=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc "
            select coalesce(string_agg(format('%s (%s)', expected.jobname, checked.problem), '; ' order by expected.jobname), '')
              from (values
                      ('scheduled_games_push_tick'::text, '* * * * *'::text, '$expected_push_sql'::text),
                      ('warn_idle_waiting_lobbies', '*/2 * * * *', '$expected_warn_sql')
                   ) as expected(jobname, schedule, command)
              left join cron.job j on j.jobname = expected.jobname
              cross join lateral (
                select case
                         when j.jobid is null then 'absent from cron.job'
                         when j.schedule is distinct from expected.schedule
                           then format('schedule is %L, expected %L', j.schedule, expected.schedule)
                         when btrim(regexp_replace(j.command, '[ \t\r\n\f\v]+', ' ', 'g')) is distinct from expected.command
                              and btrim(regexp_replace(j.command, '\s+', ' ', 'g')) is not distinct from expected.command
                           then format('command matches %L only if NON-ASCII whitespace is treated as whitespace. It contains a character such as U+2000/U+2003/U+2028/U+2029/U+3000, which Postgres regex \s matches but the SQL lexer does not -- pg_cron would raise a syntax error on every tick. Raw command: %L', expected.command, j.command)
                         when btrim(regexp_replace(j.command, '[ \t\r\n\f\v]+', ' ', 'g')) is distinct from expected.command
                           then format('command is %L, expected %L (ASCII whitespace normalised)', btrim(regexp_replace(j.command, '[ \t\r\n\f\v]+', ' ', 'g')), expected.command)
                         when j.active is distinct from true
                           then 'is registered but cron.job.active is false, so it never fires'
                         when j.database is distinct from 'postgres'
                           then format('is registered against database %L, expected %L', j.database, 'postgres')
                         when j.username is distinct from 'postgres'
                           then format('runs as %L, expected %L', j.username, 'postgres')
                         when j.nodename is distinct from 'localhost'
                           then format('is registered against nodename %L, expected %L', j.nodename, 'localhost')
                         when j.nodeport is distinct from current_setting('port')::int
                           then format('is registered against nodeport %L, expected %L', j.nodeport, current_setting('port'))
                       end as problem
              ) as checked
             where checked.problem is not null;")
          if [ -n "$bad" ]; then
            echo "::error::Expected direct-HTTP cron job(s) wrong or missing in cron.job after scheduling with both GUCs set: $bad"
            echo "This is the failure mode from issue #1167 -- a scheduling block that reports success and schedules nothing (or schedules the wrong thing)."
            exit 1
          fi
          echo "Both direct-HTTP cron jobs are present with the expected schedule and exact command."

          # The reaper, asserted by exact command. This is the regression test
          # for the guard migration re-inlining net.http_post over the tick call:
          # anything other than the bare tick invocation means baked-in
          # credentials and a bypassed transport gate. Byte-for-byte, NOT
          # whitespace-normalised: this command is a plain constant in the
          # migration rather than a dollar-quoted block, so there is no
          # reindentation to tolerate and no reason to accept anything else.
          bad=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc "
            select coalesce(
                     case
                       when j.jobid is null then 'absent from cron.job'
                       when j.schedule is distinct from '*/15 * * * *'
                         then format('schedule is %L, expected %L', j.schedule, '*/15 * * * *')
                       when j.command is distinct from 'select public.reap_idle_active_games_tick();'
                         then format('command is %L, expected %L', j.command, 'select public.reap_idle_active_games_tick();')
                       when j.active is distinct from true
                         then 'is registered but cron.job.active is false, so it never fires'
                       when j.database is distinct from 'postgres'
                         then format('is registered against database %L, expected %L', j.database, 'postgres')
                       when j.username is distinct from 'postgres'
                         then format('runs as %L, expected %L', j.username, 'postgres')
                       when j.nodename is distinct from 'localhost'
                         then format('is registered against nodename %L, expected %L', j.nodename, 'localhost')
                       when j.nodeport is distinct from current_setting('port')::int
                         then format('is registered against nodeport %L, expected %L', j.nodeport, current_setting('port'))
                     end, '')
              from (select 1) as one
              left join cron.job j on j.jobname = 'reap_idle_active_games';")
          if [ -n "$bad" ]; then
            echo "::error::reap_idle_active_games is wrong or missing in cron.job after running the guard migration with both GUCs set: $bad"
            echo "It must be registered as the tick call, not as an inlined net.http_post: the URL and the CRON_SECRET bearer must be re-read at run time (rotation-safe) and must pass the function's https transport gate (CWE-319)."
            echo "TO FIX: find the migration that re-registers reap_idle_active_games and delete that registration."
            exit 1
          fi
          echo "reap_idle_active_games is registered as the tick call with the expected schedule."

          # Finally, an INVENTORY (#1175 finding 4): everything in cron.job must
          # be one of the seven jobs this repo's migrations register. Without
          # this the gate is a whitelist-of-three presence check and an extra job
          # posting to an attacker host is simply invisible to it.
          #
          # The commands of the four pure-SQL housekeeping jobs are pinned by
          # `cron.job matches the deploy-equivalent inventory` earlier in this
          # job, and nothing between there and here touches them, so only their
          # names are re-checked at this point.
          #
          # ADDING A LEGITIMATE CRON JOB: this fails with "is in cron.job but is
          # not a declared job", printing the jobname, schedule and command.
          # A pure-SQL job needs TWO edits: the jobname array just below, and a
          # full expectation row in `cron.job matched the deploy-equivalent
          # inventory` above. A GUC-gated HTTP job needs THREE: those two plus an
          # expectation row in the direct-HTTP check earlier in this step, since
          # it is absent from the deploy-equivalent snapshot and present here.
          # A cron job reaching production without being declared in every one of
          # those places is exactly what this check exists to stop.
          bad=$(psql "$DB" -v ON_ERROR_STOP=1 -tAc "
            select coalesce(string_agg(format('%s is in cron.job but is not a declared job (schedule %L, command %L)',
                                              coalesce(j.jobname, '<a row with no jobname>'), j.schedule, j.command), '; ' order by j.jobid), '')
              from cron.job j
             where j.jobname is null
                or j.jobname <> all (array[
                     'close_idle_waiting_lobbies',
                     'drop_stale_unconfirmed_rsvps',
                     'notification_dispatches_gc',
                     'open_scheduled_games_due',
                     'reap_idle_active_games',
                     'scheduled_games_push_tick',
                     'warn_idle_waiting_lobbies'
                   ]);")
          if [ -n "$bad" ]; then
            echo "::error::Undeclared cron job(s) in cron.job after running the scheduling guard: $bad"
            echo "TO FIX: every cron job this repo schedules must be declared. If the job is legitimate, add its name to the array in this step, a full expectation row to \`cron.job matched the deploy-equivalent inventory\` above, and -- if it is a GUC-gated HTTP job -- an expectation row to the direct-HTTP check earlier in this step. If it is not legitimate, a migration in this PR is scheduling something nobody asked for."
            exit 1
          fi
          echo "cron.job contains no undeclared jobs."

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high || true
      - name: Check for hardcoded secrets
        run: |
          if grep -rn 'SUPABASE_ANON_KEY\s*=' --include='*.ts' --include='*.tsx' src/ | grep -v 'process.env' | grep -v '.env'; then
            echo "Hardcoded secrets found in source code"
            exit 1
          fi
          echo "No hardcoded secrets found"
