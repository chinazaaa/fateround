name: Mobile Rollout Gate

# Only dev -> main. Merging into `dev` is safe: installed mobile builds read the PROD
# Supabase project, so a revoke reaches users only at the promotion to main.
on:
  pull_request:
    branches: [main]
    # `edited` matters: the documented escape hatch is adding MOBILE-ROLLOUT-ACK to the PR body,
    # and the default activity types (opened/synchronize/reopened) do NOT fire on a body edit.
    # Without it the acknowledgement never re-runs the gate and the check stays red forever.
    types: [opened, synchronize, reopened, edited]

# This job only reads the repo; it writes nothing back.
permissions:
  contents: read

jobs:
  mobile-rollout-gate:
    name: Mobile Rollout Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the extract step below reads the gate script out of the base commit,
          # whose objects a depth-1 clone would not have. A missing base commit is now a hard
          # failure there rather than a silent fallback, so removing this breaks the job loudly
          # instead of quietly disabling the gate.
          #
          # Do NOT add `filter: blob:none` here. It does not currently bypass the gate only
          # because this repository is public and the runner can lazily fetch the missing blob
          # anonymously. If fateround is ever made private that lazy fetch stops working, and a
          # blobless clone becomes a one-word way to make the script's blob look absent from
          # base — which lands on the bootstrap branch and runs the PR's own copy.
          fetch-depth: 0
          # Don't leave a usable token in .git/config for anything this job runs.
          persist-credentials: false

      # Run the enforcement script from the BASE revision, not the PR's.
      #
      # A required check that executes code the pull request can edit is not a gate: a PR that
      # revokes a column could also rewrite this script to exit 0 and the check would pass. The
      # script is therefore extracted from the base commit to a path outside the working tree and
      # run from there. It still INSPECTS the PR's migrations (via HEAD_SHA) — only the
      # enforcement logic is pinned to what main already trusts.
      #
      # Scope, honestly: this closes some bypasses, not the class. This step, its inputs and this
      # job's checkout options are all in this file, which the pull request can edit — and the
      # `git` commands implementing the pinning are themselves $PATH lookups. The real boundary is
      # owner review of the paths in .github/CODEOWNERS: `.github/`, `scripts/`, and the install
      # surface a job executes on its own (package.json's `prepare` hook, pnpm-lock.yaml,
      # pnpm-workspace.yaml, .npmrc, .husky/) — that last group because reaching it needs no
      # workflow edit. See that file, including the caveat that it only blocks a merge once a
      # ruleset requires code-owner review.
      - name: Extract the gate script from the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate"
          dest="$RUNNER_TEMP/gate/mobile-rollout-gate.mjs"
          script=scripts/ci/mobile-rollout-gate.mjs

          if [ -z "$BASE_SHA" ]; then
            echo "::error::github.event.pull_request.base.sha is empty, so there is no base revision to pin the gate to. Refusing to run the gate from the pull request's own copy."
            exit 1
          fi

          # Distinguish "the clone does not have the base commit" from "the base commit does not
          # have the script" — they are NOT the same thing, and treating any `git show` failure as
          # the second one is a complete bypass: drop `fetch-depth: 0` above (it reads like a
          # clone-cost tweak), replace the script with `exit 0`, and a depth-1 clone makes
          # `git show` fail for missing OBJECTS. The fallback then installs the PR's own copy and
          # the check goes green with zero enforcement. A missing base commit is an
          # infrastructure error; only a genuinely absent blob is the bootstrap case.
          #
          # Two things this does not close, recorded so nobody assumes otherwise: `script=` is a
          # PR-editable assignment, so renaming it to a path the base revision does not have
          # reaches the bootstrap branch legitimately; and `filter: blob:none` on the checkout
          # above would do the same if this repository were ever made private (today the runner
          # can lazily fetch the missing blob anonymously because it is public). Both are visible
          # edits to owned paths.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::error::Base commit $BASE_SHA is not present in this clone, so the gate cannot be pinned to it. The checkout above must fetch the base commit (fetch-depth: 0). Refusing to fall back to the pull request's own copy — a shallow clone is not a bootstrap."
            exit 1
          fi

          # And it has to be a plausible BASE. `github.sha` on a pull_request event is the PR's
          # OWN merge commit, so pointing BASE_SHA at it would read the gate out of the tree under
          # review while the log still said "pinned". Reject a BASE_SHA that is the checked-out
          # commit, and require it to be an ancestor of it (the real base tip always is — it is a
          # parent of the merge commit). ANY ancestor passes, so an old `main` commit from before
          # the gate landed still reaches the bootstrap branch; that edit is visible in this
          # file's diff, which is what CODEOWNERS is for.
          head_sha=$(git rev-parse HEAD)
          base_resolved=$(git rev-parse --verify "$BASE_SHA^{commit}")
          if [ "$base_resolved" = "$head_sha" ]; then
            echo "::error::BASE_SHA resolves to the checked-out commit itself ($head_sha). That is the revision under review, not a base to pin against — github.sha on a pull_request event is the PR's own merge commit and must not be used here."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base_resolved" "$head_sha"; then
            echo "::error::BASE_SHA ($base_resolved) is not an ancestor of the checked-out commit ($head_sha), so it is not the base this pull request is being merged into. Refusing to treat it as the pinning revision."
            exit 1
          fi

          if git cat-file -e "$BASE_SHA:$script" 2>/dev/null; then
            git show "$BASE_SHA:$script" > "$dest"
            echo "Using the gate script from the base revision ($BASE_SHA) — enforcement logic is pinned."
          else
            # BOOTSTRAP, and only this: the base commit is present and verifiably does not contain
            # the gate, because this workflow reaches `main` for the first time in the very PR it
            # is guarding. Pinning to base protects an ESTABLISHED gate from being edited by the PR
            # under review; on the first promotion there is no established gate, so falling back to
            # this PR's copy is no weaker than main not having the workflow at all. Every
            # subsequent run takes the branch above.
            echo "::warning::Gate script absent from base commit $BASE_SHA (the commit itself is present) — bootstrap run, using this PR's copy. Enforcement logic is NOT pinned for this run only."
            cp "$script" "$dest"
          fi

      - name: Check for revokes that break installed mobile builds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Via env, never interpolated into the shell — PR bodies are untrusted input.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node "$RUNNER_TEMP/gate/mobile-rollout-gate.mjs"
