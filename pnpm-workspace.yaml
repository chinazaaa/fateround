# pnpm build-script approvals. `sharp` ships a native postinstall build script;
# we deliberately do NOT run it (the app runs fine without a locally-compiled
# sharp, and skipping unreviewed install scripts is the safer default). Setting
# this explicitly to `false` acknowledges the choice so pnpm stops raising
# ERR_PNPM_IGNORED_BUILDS on install / before every `pnpm <script>`.
#
# `@sentry/cli` ships a postinstall, and source-map upload needs its binary — but NOT via that
# script. The binary arrives as a platform optionalDependency (`@sentry/cli-linux-x64` and
# friends), and the postinstall exists only as a fallback for installs run with --no-optional:
# its own source says it skips the download when the optional package resolved. So uploads work
# with this left `false`, and no install script needs approving. Keep it that way.
allowBuilds:
  sharp: false
  '@sentry/cli': false
