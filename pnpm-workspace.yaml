# pnpm build-script approvals. `sharp` ships a native postinstall build script;
# we deliberately do NOT run it (the app runs fine without a locally-compiled
# sharp, and skipping unreviewed install scripts is the safer default). Setting
# this explicitly to `false` acknowledges the choice so pnpm stops raising
# ERR_PNPM_IGNORED_BUILDS on install / before every `pnpm <script>`.
#
# `@sentry/cli` ships a postinstall that downloads a native binary, and uploading source maps
# needs it. Approved deliberately rather than by habit: production stack traces were unreadable
# (`main-4f2a.js:1:28174`) without them, which cost real debugging time. This is the ONE install
# script this repo runs, and it stays narrow — `sharp` below is still refused.
allowBuilds:
  sharp: false
  '@sentry/cli': true
