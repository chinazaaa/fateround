<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color:#fff; position:relative;
    -webkit-font-smoothing:antialiased;
  }
  #stage { width:1200px; height:630px; position:relative; }

  /* LEFT COLUMN */
  .left { position:absolute; left:60px; top:56px; width:560px; }
  .brand { display:flex; align-items:center; gap:14px; }
  .logo {
    width:44px; height:44px; border-radius:12px;
    background:linear-gradient(150deg,#fb5a7e,#f43f5e);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(244,63,94,.35);
  }
  .logo svg { width:24px; height:24px; }
  .brand .name { font-size:27px; font-weight:800; letter-spacing:-.5px; }
  .brand .name .r { color:#f6547e; }

  .eyebrow {
    display:inline-block; margin-top:66px;
    padding:9px 18px; border-radius:999px;
    font-size:15px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase;
  }
  .title { margin-top:22px; font-weight:800; line-height:.98; letter-spacing:-2.5px; color:#fdfdff; }
  .desc { margin-top:24px; font-size:25px; line-height:1.36; color:#9aa1ad; max-width:480px; }
  .pills { margin-top:32px; display:flex; gap:12px; flex-wrap:wrap; max-width:520px; }
  .pill {
    padding:11px 19px; border-radius:999px; font-size:17px; font-weight:600;
  }
  .url { position:absolute; left:60px; bottom:46px; font-size:30px; font-weight:800; letter-spacing:-.5px; }

  /* RIGHT COLUMN CARD */
  .right {
    position:absolute; right:44px; top:80px; width:522px; height:470px;
    border-radius:22px; overflow:hidden;
    background:rgba(16,17,22,.72);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    backdrop-filter:blur(2px);
  }
  .rhead {
    height:58px; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; font-size:15px;
    border-bottom:1px solid rgba(255,255,255,.07);
  }
  .rhead .mid { color:#8b93a1; }
  .tag { padding:6px 12px; border-radius:9px; font-weight:700; font-size:13.5px; }
  .rbody { padding:20px; }
  .muted { color:#8b93a1; }
</style>
</head>

function checkersBoard(size=8){
  const cell = size===8 ? 44 : 36;
  let cells='';
  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      const dark=(r+c)%2===1;
      const bg=dark?'#8a5a3c':'#e8cfa8';
      let piece='';
      const midLo = Math.floor(size/2)-1, midHi = Math.floor(size/2);
      const hl=(r===midHi&&c===midLo-1);
      if(dark){
        if(r<midLo-1){ piece=pieceHtml('#ef4444','#b91c1c', r===midLo-2&&c===(size-3)); }
        else if(r>midHi){ piece=pieceHtml('#2b2b33','#111', r===midHi+1&&c===2); }
      }
      if(r===midHi&&c===midLo-1){ piece=pieceHtml('#2b2b33','#111',false); }
      cells+=`<div style="width:${cell}px;height:${cell}px;background:${bg};display:flex;align-items:center;justify-content:center;box-shadow:${hl?'inset 0 0 0 3px rgba(239,68,68,.9)':'none'}">${piece}</div>`;
    }
  }
  return `<div style="display:grid;grid-template-columns:repeat(${size},${cell}px);border-radius:10px;overflow:hidden;border:3px solid #5a3620;box-shadow:0 12px 30px rgba(0,0,0,.4)">${cells}</div>`;
}
function pieceHtml(a,b,king){
  return `<div style="width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,${a},${b});box-shadow:0 2px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#ffd76a;font-size:15px">${king?'♛':''}</div>`;
}

function ayoBoard(){
  const counts=[[4,0,4,5,1,4],[3,4,2,3,4,0]];
  function pit(n,cap){
    return `<div style="width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#7c4a1e,#4a2a10);box-shadow:inset 0 3px 8px rgba(0,0,0,.55),${cap?'0 0 0 3px #34d399':'0 2px 3px rgba(0,0,0,.3)'};display:flex;align-items:center;justify-content:center;position:relative">
      ${seeds(n)}
      <span style="position:absolute;bottom:-2px;right:-2px;background:#1b120a;color:#fbbf24;font-size:12px;font-weight:800;border-radius:999px;padding:1px 6px;border:1px solid #7c4a1e">${n}</span></div>`;
  }
  function seeds(n){
    let s='';const m=Math.min(n,6);
    for(let i=0;i<m;i++){ s+=`<span style="position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fde68a,#b45309);top:${18+Math.floor(i/3)*20}px;left:${16+(i%3)*13}px"></span>`; }
    return s;
  }
  const rowTop=counts[0].map((n,i)=>pit(n,false)).join('');
  const rowBot=counts[1].map((n,i)=>pit(n,i===2)).join('');
  return `<div style="background:linear-gradient(180deg,#8a5522,#5a3315);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 2px 6px rgba(255,255,255,.12)">

    <div style="display:flex;gap:14px">${rowBot}</div></div>`;
}

function xwGrid(){
  const cell=56;
  const g=[
    ['P','L','A','Y','#'],
    ['','#','#','','#'],
    ['G','R','I','D','#'],
    ['','#','#','','#'],
    ['#','W','I','N','S'],
  ];
  const nums={'0,0':1,'0,3':2,'2,0':3,'4,1':4};
  let cells='';
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){
    const v=g[r][c];
    if(v==='#'){ cells+=`<div style="width:${cell}px;height:${cell}px;background:#0b0c11"></div>`; continue; }
    const filled=v!=='';
    const cur=(r===0); // highlight the current across word
    const n=nums[r+','+c];
    const bg=cur?'rgba(14,165,233,.24)':(filled?'#f4f7fa':'#dfe6ee');
    const border=cur?'2px solid #0ea5e9':'1px solid #b9c4d1';
    cells+=`<div style="position:relative;width:${cell}px;height:${cell}px;background:${bg};border:${border};display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#0f172a">
      ${n?`<span style="position:absolute;top:2px;left:4px;font-size:11px;font-weight:700;color:#475569">${n}</span>`:''}${filled?v:''}</div>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(5,${cell}px);gap:3px;background:#8595a8;padding:3px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.4)">${cells}</div>`;
}

function wsGrid(){
  const cell=52;
  const g=[
    ['P','A','R','T','Y','K'],
    ['Z','G','B','M','F','Q'],
    ['W','A','X','C','O','R'],
    ['N','M','D','H','J','U'],
    ['V','E','L','T','S','I'],
    ['B','O','Y','P','W','N'],
  ];
  const violet={}, green={};
  ['0,0','0,1','0,2','0,3','0,4'].forEach(k=>violet[k]=1); // PARTY across
  ['1,1','2,1','3,1','4,1'].forEach(k=>green[k]=1);        // GAME down
  let cells='';
  for(let r=0;r<6;r++)for(let c=0;c<6;c++){
    const k=r+','+c, v=g[r][c];
    let bg='transparent',col='#c7cdd6',rad='0';
    if(violet[k]){bg='rgba(139,92,246,.4)';col='#fff';rad='11px';}
    if(green[k]){bg='rgba(34,197,94,.34)';col='#fff';rad='11px';}
    cells+=`<div style="width:${cell}px;height:${cell}px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;color:${col};background:${bg};border-radius:${rad}">${v}</div>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(6,${cell}px);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:7px">${cells}</div>`;
}

    <span style="width:30px;height:30px;border-radius:50%;background:rgba(239,68,68,.2);color:#fca5a5;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">${name[0]}</span>
    <span style="font-weight:600;font-size:17px;min-width:52px">${name}</span>
    <span style="font-size:19px;font-weight:700;color:#fff">${word}${cursor}</span>
    ${s.right}</div>`;
}

/* ---------- daily-challenge helpers ---------- */
function sudokuGrid(){
  const cell=44;
  const vals=[
    [5,'',3,'','',7,'','',2],
    ['',8,'','',4,'','',6,''],
    ['','','',2,'','',1,'',''],
    [3,'','','',7,'','','',4],
    ['',1,'',8,'',3,'',9,''],
    [7,'','','',6,'','','',8],
    ['','',6,'','',9,'','',''],
    ['',4,'','',1,'','',2,''],
    [9,'',1,'','',5,3,'',7],
  ];
  let cells='';
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const v=vals[r][c];
    const thick=(x)=>x%3===0&&x>0;
    const bl=thick(c)?'3px solid rgba(255,255,255,.35)':'1px solid rgba(255,255,255,.08)';
    const bt=thick(r)?'3px solid rgba(255,255,255,.35)':'1px solid rgba(255,255,255,.08)';
    const filled=v!=='';
    const userFill=!filled?'':'';
    const col=filled?'#e2e8f0':'#6ee7b7';
    cells+=`<div style="width:${cell}px;height:${cell}px;border-left:${bl};border-top:${bt};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:${filled?'800':'600'};color:${col}">${v}</div>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(9,${cell}px);border:3px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden;background:rgba(255,255,255,.03)">${cells}</div>`;
}

function trivOpt(letter,text,selected){
  const bg=selected?'rgba(244,63,94,.16)':'rgba(255,255,255,.04)';
  const bd=selected?'rgba(244,63,94,.5)':'rgba(255,255,255,.1)';
  const lbg=selected?'#f43f5e':'rgba(255,255,255,.08)';
  const lcol=selected?'#fff':'#8b93a1';
  return `<div style="display:flex;align-items:center;gap:13px;background:${bg};border:1px solid ${bd};border-radius:12px;padding:12px 16px">
    <span style="width:30px;height:30px;border-radius:50%;background:${lbg};color:${lcol};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800">${letter}</span>
    <span style="font-size:17px;font-weight:600">${text}</span>
    ${selected?'<span style="margin-left:auto;color:#fda4af;font-weight:800;font-size:16px">✓</span>':''}</div>`;
}

function whGrid(){
  const cell=52;
  const g=[
    ['R','I','N','G','S'],
    ['E','A','G','R','I'],
    ['S','I','N','K','G'],
    ['T','R','G','E','N'],
    ['S','I','N','G','S'],
  ];
  const hl={'0,0':1,'0,1':1,'0,2':1,'0,3':1,'1,3':1,'2,3':1,'2,2':1,'2,1':1};
  let cells='';
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){
    const k=r+','+c, v=g[r][c];
    const on=hl[k];
    const bg=on?'rgba(249,115,22,.4)':'transparent';
    const col=on?'#fff':'#c7cdd6';
    cells+=`<div style="width:${cell}px;height:${cell}px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:${col};background:${bg};border-radius:${on?'11px':'0'}">${v}</div>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(5,${cell}px);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:7px">${cells}</div>`;
}
function whWord(w,found){
  return `<span style="padding:9px 15px;border-radius:999px;font-size:16px;font-weight:700;
    ${found?'color:#fdba74;background:rgba(249,115,22,.16);border:1px solid rgba(249,115,22,.4);text-decoration:line-through':'color:#8b93a1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)'}">${w}</span>`;
}

function hexA(hex,a){
  const h=hex.replace('#','');
  const r=parseInt(h.substring(0,2),16),gg=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);
  return `rgba(${r},${gg},${b},${a})`;
}
