# Production store release for apps/mobile.
#
# LOCATION IS LOAD-BEARING. This file must live at `apps/mobile/.eas/workflows/`, beside
# `apps/mobile/eas.json` — "The .eas directory should be at the same level as your eas.json
# file" (EAS workflow syntax docs). At the repo root it would resolve against the ROOT
# `eas.json`/`app.json`, which are vestigial leftovers from before the apps/ split: they
# declare `com.fateround.fateround` instead of `com.fateround.app`, carry a bare
# `production` profile with no channel or environment, and sit next to a package.json with
# no `expo` dependency at all — yet they repeat the SAME `extra.eas.projectId`, so EAS
# accepts the root as "the project" and raises no mismatch. Run and validate from
# `apps/mobile`, and set the EAS GitHub connection's base directory to `apps/mobile`.
#
# Until this existed, every release was `eas build` / `eas submit` run by hand from
# whoever's machine had the credentials — unrecorded, and unrepeatable by anyone else.
#
# WHY MANUAL-ONLY, NOT ON A TAG OR A PUSH
# A store submission is irreversible in the ways that matter: a build number is consumed,
# a binary enters review, and a release can reach users. The one thing this workflow must
# never do is submit because someone pushed. `workflow_dispatch` is the whole trigger, and
# `require-approval` sits between building and submitting so the binaries exist and can be
# inspected before anything is handed to Apple or Google.
#
# WHY THIS RELEASE MATTERS MORE THAN USUAL
# `apps/mobile/app.json` declares no `updates` block and no `runtimeVersion`, while
# `expo-updates` is a dependency. So OTA is installed but unconfigured: there is NO way to
# change an installed client except a store release and user adoption. That is why the
# `Mobile Rollout Gate` blocks promoting column revokes to production — an installed build
# that still selects a revoked column gets 42501 on the whole request and the game breaks
# until the user updates from the store.
#
# VERSIONING comes from EAS, not this file: eas.json sets `appVersionSource: remote` and
# `autoIncrement` on the production profile, so build numbers are allocated server-side.
# Do not add version bumps here.
#
# COST: every run consumes EAS build minutes, and submission needs live Apple Developer and
# Google Play accounts. See https://expo.dev/pricing.

name: Production store release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which stores to release to
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      message:
        description: Build message shown in the EAS dashboard (e.g. the release reason)
        type: string
        default: Production store release

jobs:
  # Built as two jobs rather than one `platform: all` job so that a failure on one store
  # does not discard the other's binary — iOS and Android fail for unrelated reasons
  # (provisioning vs. signing), and a lost Android build should not wait on an Apple fix.
  build_ios:
    name: Build iOS
    if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
    type: build
    params:
      platform: ios
      profile: production
      message: ${{ inputs.message }}

  build_android:
    name: Build Android
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    type: build
    params:
      platform: android
      profile: production
      message: ${{ inputs.message }}

  # The deliberate stop. Everything above is reversible — a build is just an artifact.
  # Everything below reaches Apple, Google, and eventually users.
  #
  # ONE APPROVAL PER PLATFORM, deliberately, even though it means two clicks on an `all`
  # release. A single gate `after` both builds has to decide what to do when one platform
  # fails, and every answer is wrong: require both to succeed and a failed iOS build strands
  # a perfectly good Android binary, unshipped — which is exactly the coupling the two-job
  # split above exists to prevent. Per-platform gates keep each store independent end to end.
  #
  # `after`, NOT `needs`, and this is the whole reason: a job skipped by its `if` "won't have
  # completed successfully", so anything listing it in `needs` never runs. A gate on
  # `needs: [build_ios]` would therefore vanish on an Android-only release and take its
  # submit with it. `after` settles whatever the upstream outcome, and the `if` restores the
  # part we wanted from `needs`: never ask to approve a build that failed or never ran.
  # The documented status union is exactly `success | failure | skipped`, so `== 'success'`
  # is the precise test. Note the real safety property is `needs` on the submit jobs below —
  # this `if` is belt-and-braces against being asked to approve nothing.
  approve_ios:
    name: Approve App Store submission
    after: [build_ios]
    if: ${{ after.build_ios.status == 'success' }}
    type: require-approval

  approve_android:
    name: Approve Google Play submission
    after: [build_android]
    if: ${{ after.build_android.status == 'success' }}
    type: require-approval

  # These keep `needs` deliberately: each submit must not run unless ITS build succeeded and
  # ITS approval was granted (an approval job succeeds iff approved, fails iff rejected).
  # That also makes a platform `if` unnecessary here — a skipped build skips its own submit.
  #
  # `submit` needs credentials registered on EAS beforehand — an App Store Connect API key
  # via `eas credentials --platform ios`, and a Google Service Account key — because
  # `eas.json`'s `submit.production` is empty, which is valid but defers everything to
  # server-side state. Verify both exist before the first dispatch; this is the one failure
  # here that can only surface at run time.
  submit_ios:
    name: Submit to App Store Connect
    needs: [build_ios, approve_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_android:
    name: Submit to Google Play
    needs: [build_android, approve_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
